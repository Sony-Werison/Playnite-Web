function addTimelineYear(listId = currentListId) {
    const list = getListById(rootData.Lists, listId);
    if (!list || list.IsAutomatic) return;
    const input = prompt('Ano da linha do tempo (1 a 9999):', String(new Date().getFullYear()));
    if (input === null) return;
    const year = Number(input);
    if (!validYear(year)) { alert('Informe um ano válido.'); return; }
    list.Children ||= [];
    if (list.Children.some(child => child.TimelineYear === year)) { alert('Esse ano já existe nesta linha do tempo.'); return; }
    list.Children.push(makeYearNode(year));
    list._expanded = true;
    markDirty();
    selectList(list.Id, true);
}
function deleteTimelineYear(id) {
    const node = getListById(rootData.Lists, id);
    const parent = findParent(rootData.Lists, id);
    if (!node || !parent || !validYear(node.TimelineYear)) return;
    if (!confirm(`Excluir o ano ${node.TimelineYear}? Os jogos voltarão para "Sem ano" na lista "${parent.Name}".`)) return;
    function collectGames(list) { return [...(list.GameIds || []), ...(list.Children || []).flatMap(collectGames)]; }
    parent.GameIds = [...new Set([...(parent.GameIds || []), ...collectGames(node)])];
    parent.Children = parent.Children.filter(child => child.Id !== id);
    cancelDoubleClickMove();
    if (!getListById(rootData.Lists, currentListId)) currentListId = parent.Id;
    markDirty();
    renderSidebar();
    if (currentListId) selectList(currentListId, true);
}
function renderTimeline(list, area) {
    const years = orderedTimelineChildren(list).filter(child => validYear(child.TimelineYear));
    const timeline = document.createElement('div');
    timeline.className = 'timeline';
    const intro = document.createElement('div');
    intro.className = 'timeline-intro';
    intro.innerHTML = `<strong>Sua história em jogos</strong><p>${years.length} ${years.length === 1 ? 'ano' : 'anos'} · ${countGames(list)} jogos${cfgInteractionMode === 'view' ? '' : ' · Arraste as capas para organizar cada ano'}</p>`;
    timeline.appendChild(intro);
    const scroll = document.createElement('div');
    scroll.className = list.TimelineOrientation === 'Horizontal' ? 'timeline-horizontal' : 'timeline-vertical';
    scroll.dataset.scrollListId = list.Id;
    if (list.TimelineOrientation === 'Horizontal') {
        const nav = document.createElement('div');
        nav.className = 'timeline-scroll-nav';
        for (const [label,direction] of [['← Anterior',-1],['Próximo →',1]]) {
            const button = document.createElement('button');
            button.className = 'btn-outline';
            button.textContent = label;
            button.onclick = () => {
                stopHorizontalAnimation(scroll);
                scroll.scrollBy({left:direction * Math.max(240,scroll.clientWidth * .7),behavior:'smooth'});
            };
            nav.appendChild(button);
        }
        timeline.appendChild(nav);
    }
    const track = document.createElement('div');
    track.className = 'timeline-track';
    [...years, list].forEach(child => {
        const pending = child === list;
        const row = document.createElement('div');
        row.className = 'timeline-year' + (pending ? ' timeline-pending' : '');
        row.style.setProperty('--year-accent', /^#[0-9a-f]{6}$/i.test(child.HexColor) ? child.HexColor : '#66c7ed');
        const gamesClass = cfgTierLayout === 'HorizontalScroll' ? 'tier-games horizontal-scroll' : 'tier-games';
        row.innerHTML = `<div class="timeline-panel"><div class="timeline-year-heading"><div><h3>${pending ? 'Sem ano' : child.TimelineYear}</h3><small>${(child.GameIds || []).length} jogos</small></div></div><div class="${gamesClass}" data-list-id="${child.Id}" data-year="${pending ? '' : child.TimelineYear}">${getSortedGameIds(child, list.SortOrder).map(generateCard).join('')}</div></div>`;
        track.appendChild(row);
    });
    scroll.appendChild(track);
    timeline.appendChild(scroll);
    area.appendChild(timeline);
}
function selectList(id, preserveSearch = false) {
    const tierScrollPositions = captureTierScrollPositions();
    const area = document.getElementById('content-area');
    const scrollTop = currentListId === id ? area.scrollTop : 0;
    const list = getListById(rootData.Lists, id);
    if (!list) return;
    const revision = ++contentRenderRevision;
    if (migrateTimelineLists(rootData.Lists || [])) markDirty();
    if (!preserveSearch && currentListId !== id) currentSearch = '';
    currentListId = id;
    const searchBox = document.getElementById('current-search');
    if (searchBox) searchBox.value = currentSearch;
    renderSidebar();

    document.getElementById('main-header').style.visibility = 'visible';
    document.getElementById('header-title').textContent = list.Name;
    document.getElementById('header-color').style.background = list.HexColor || '#8B7CFF';
    document.getElementById('header-count').textContent = `${countGames(list)} jogos${list.IsAutomatic ? ' · Biblioteca automática' : ''}`;
    const sortSelect = document.getElementById('sort-select');
    if (sortSelect) sortSelect.value = normalizeSortMode(list.SortOrder);

    const view = listView(list);
    document.getElementById('view-select').value = view;
    document.getElementById('view-select').disabled = !!list.IsAutomatic;
    for (const key of ['order','orientation']) {
        const control = document.getElementById(`timeline-${key}`);
        control.style.display = view === 'Timeline' ? '' : 'none';
        control.value = key === 'order' ? (list.TimelineOrder === 'Descending' ? 'Descending' : 'Ascending') : (list.TimelineOrientation === 'Horizontal' ? 'Horizontal' : 'Vertical');
    }
    area.innerHTML = '';

    const isTier = view === 'Tier';

    if (view === 'Timeline') {
        renderTimeline(list, area);
    } else if (isTier) {
        const tierSortMode = normalizeSortMode(list.SortOrder);
        (list.Children || []).forEach(child => {
            const row = document.createElement('div');
            row.className = 'tier-row';
            const gamesClass = cfgTierLayout === 'HorizontalScroll' ? 'tier-games horizontal-scroll' : 'tier-games';
            row.innerHTML = `<div class="tier-header" style="background:${child.HexColor || '#444'};color:${isDark(child.HexColor) ? '#fff' : '#111'}">${esc(child.Name)}</div>
                             <div class="${gamesClass}" data-list-id="${child.Id}">${getSortedGameIds(child, tierSortMode).map(generateCard).join('')}</div>`;
            area.appendChild(row);
        });

        // Jogos que pertencem diretamente à lista-mãe aparecem como uma tier especial
        // de pendentes, sempre por último, e podem ser arrastados para qualquer sublista.
        {
            const row = document.createElement('div');
            row.className = 'tier-row pending-tier';
            const gamesClass = cfgTierLayout === 'HorizontalScroll' ? 'tier-games horizontal-scroll' : 'tier-games';
            row.innerHTML = `<div class="tier-header">Pendentes</div>
                             <div class="${gamesClass}" data-list-id="${list.Id}">${getSortedGameIds(list, tierSortMode).map(generateCard).join('')}</div>`;
            area.appendChild(row);
        }
    } else {
        // Normal grid — collect all GameIds (own + children) if it's a parent list
        let ids = list.GameIds || [];
        const grid = document.createElement('div');
        grid.className = 'games-grid';
        grid.dataset.listId = list.Id;
        ids = getSortedGameIds(list);
        grid.innerHTML = ids.map(generateCard).join('');
        area.appendChild(grid);
    }
    initCardDrag();
    area.scrollTop = scrollTop;
    requestAnimationFrame(() => {
        if (currentListId !== id || revision !== contentRenderRevision) return;
        updateTierHeaderWidth();
        area.scrollTop = scrollTop;
        restoreTierScrollPositions(tierScrollPositions, revision);
    });
}

function isDark(hex) {
    if (!hex) return true;
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) < 140;
}

function moveGameToList(gid, fromId, toId) {
    if (cfgInteractionMode !== 'drag') return;
    const from = getListById(rootData.Lists, fromId);
    const to   = getListById(rootData.Lists, toId);
    if (!from || !to) return;
    if (to.IsAutomatic) return;
    if (from.GameIds && !from.IsAutomatic) from.GameIds = from.GameIds.filter(x => x !== gid);
    if (!to.GameIds) to.GameIds = [];
    if (!to.GameIds.includes(gid)) to.GameIds.push(gid);
    markDirty();
    selectList(currentListId);
    requestAnimationFrame(updateTierHeaderWidth);
}

// Modo de clique duplo para mover jogos
// ──────────────────────────────────────────────
// O primeiro duplo clique coloca o jogo em "modo de transporte". O próximo
// clique em um destino válido confirma a movimentação. Cliques inválidos ou
// no próprio jogo não alteram nada e mantêm o transporte ativo.
let clickMove = null;
let clickMoveInitialized = false;
let moveCursor = null;
let moveFrame = 0;

// Roda do mouse, Shift+roda e gesto lateral usam o mesmo caminho na web e no app.
const wheelTargets = new WeakMap();
function stopHorizontalAnimation(element) {
    if (!element) return;
    const state = wheelTargets.get(element);
    if (state?.frame) cancelAnimationFrame(state.frame);
    wheelTargets.delete(element);
    element.scrollTo?.({left:element.scrollLeft,behavior:'instant'});
}
document.addEventListener('wheel', e => {
    if (e.ctrlKey) return;
    const lateral = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
    const timeline = e.target.closest?.('.timeline-horizontal');
    if (!lateral && !timeline?.classList?.contains('timeline-horizontal')) return;
    const inner = e.target.closest?.('.tier-games.horizontal-scroll');
    const tier = lateral && inner && inner.scrollWidth > inner.clientWidth ? inner : timeline;
    if (!tier || tier.scrollWidth <= tier.clientWidth) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? tier.clientWidth : 1;
    const delta = (e.shiftKey || !lateral ? (e.deltaY || e.deltaX) : e.deltaX) * unit;
    let state = wheelTargets.get(tier);
    if (!state) { state = { target: tier.scrollLeft, frame: 0, time: 0 }; wheelTargets.set(tier, state); }
    if (!state.frame) tier.scrollTo?.({left:tier.scrollLeft,behavior:'instant'});
    if (!state.frame) state.target = tier.scrollLeft;
    state.target = Math.max(0, Math.min(tier.scrollWidth - tier.clientWidth, state.target + delta));
    if (state.frame) return;
    state.time = performance.now();
    const step = now => {
        const factor = 1 - Math.exp(-Math.min(50, now - state.time) / 110);
        state.time = now;
        const distance = state.target - tier.scrollLeft;
        if (!tier.isConnected || (!tier.classList.contains('horizontal-scroll') && !tier.classList.contains('timeline-horizontal')) || Math.abs(distance) < .6) {
            tier.scrollLeft = state.target; state.frame = 0; return;
        }
        tier.scrollLeft += distance * factor;
        state.frame = requestAnimationFrame(step);
    };
    state.frame = requestAnimationFrame(step);
}, { passive: false });

window.handlePlayniteWheel = ({x,y,deltaY,shiftKey}) => {
    const clientX = x * window.innerWidth, clientY = y * window.innerHeight;
    const target = document.elementFromPoint(clientX,clientY);
    if (!target) return;
    const event = new WheelEvent('wheel',{bubbles:true,cancelable:true,clientX,clientY,deltaY,shiftKey});
    target.dispatchEvent(event);
    if (event.defaultPrevented) return;
    // Synthetic wheel events have no native default scroll. Reproduce it for
    // vertical lists/modals, while the shared handler above owns horizontal scroll.
    for (let element = target; element; element = element.parentElement) {
        if (/(auto|scroll)/.test(getComputedStyle(element).overflowY) && element.scrollHeight > element.clientHeight) {
            const before = element.scrollTop;
            element.scrollTop += deltaY;
            if (before !== element.scrollTop) return;
        }
    }
};

function followMoveCursor() {
    if (!clickMove || !moveCursor) { moveFrame = 0; return; }
    const { x, y } = moveCursor;
    const el = document.elementFromPoint(x, y);
    const tier = el?.closest?.('.tier-games.horizontal-scroll');
    if (tier) {
        const r = tier.getBoundingClientRect(), edge = 55;
        if (x > r.right - edge) tier.scrollLeft += Math.min(18, (x - r.right + edge) * .3);
        else if (x < r.left + edge) tier.scrollLeft -= Math.min(18, (r.left + edge - x) * .3);
    }
    const timelineScroll = el?.closest?.('.timeline-horizontal');
    if (timelineScroll) {
        const rect = timelineScroll.getBoundingClientRect();
        if (x > rect.right - 55) timelineScroll.scrollLeft += 14;
        else if (x < rect.left + 55) timelineScroll.scrollLeft -= 14;
    }
    const area = document.getElementById('content-area'), r = area.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        if (y > r.bottom - 45) area.scrollTop += 12;
        else if (y < r.top + 45) area.scrollTop -= 12;
    }
    updateDoubleClickMoveTarget(x, y);
    moveFrame = requestAnimationFrame(followMoveCursor);
}

function createClickMoveGhost(card) {
    const ghost = card.cloneNode(true);
    ghost.classList.remove('dragging', 'sortable-chosen', 'sortable-ghost');
    ghost.classList.add('click-move-ghost');
    ghost.style.width = card.getBoundingClientRect().width + 'px';
    document.body.appendChild(ghost);
    return ghost;
}

function ensureClickMoveLine() {
    let line = document.getElementById('click-move-line');
    if (!line) {
        line = document.createElement('div');
        line.id = 'click-move-line';
        line.className = 'click-move-line';
        document.body.appendChild(line);
    }
    return line;
}

function clearClickMoveVisuals() {
    clearDropPreview();
    document.querySelectorAll('.click-move-source').forEach(el => el.classList.remove('click-move-source'));
    clickMove?.sourceCard?.classList.remove('move-source-hidden');
}

function clearDropPreview() {
    document.getElementById('game-remove-zone').classList.remove('active');
    const line = document.getElementById('click-move-line');
    if (line) line.style.display = 'none';
    document.querySelectorAll('.click-move-target, .move-gap').forEach(el => {
        el.classList.remove('click-move-target', 'move-gap');
        el.style.removeProperty('--insert-shift');
    });
    dropPreviewKey = null;
    document.querySelectorAll('.card-drop-slot').forEach(el => el.remove());
}

let dropPreviewKey = null;

function baseCardRect(card) {
    const r = card.getBoundingClientRect();
    const transform = getComputedStyle(card).transform;
    const dx = transform && transform !== 'none' ? new DOMMatrixReadOnly(transform).m41 : 0;
    return { left: r.left - dx, right: r.right - dx, top: r.top, bottom: r.bottom, height: r.height };
}

function nearestInsertionCard(holder, x, y) {
    const candidates = Array.from(holder.querySelectorAll('.game-card'))
        .filter(card => card.dataset.id !== clickMove.id)
        .map(card => ({ card, rect: baseCardRect(card) }));
    if (!candidates.length) return null;
    const distance = r => Math.max(r.top - y, 0, y - r.bottom) * 10000 + Math.max(r.left - x, 0, x - r.right);
    candidates.sort((a, b) => distance(a.rect) - distance(b.rect));
    const { card, rect } = candidates[0];
    return { targetId: card.dataset.id, after: x > (rect.left + rect.right) / 2 };
}

function startDoubleClickMove(card, e, pointerDrag = false) {
    if ((!pointerDrag && cfgInteractionMode !== 'double') || clickMove) return;
    const holder = card.closest('[data-list-id]');
    if (!holder) return;
    const sourceId = holder.dataset.listId;
    const source = getListById(rootData.Lists, sourceId);
    if (!source) return;

    e.preventDefault();
    e.stopPropagation();
    const ghost = createClickMoveGhost(card);
    const r = card.getBoundingClientRect();
    clickMove = { id: card.dataset.id, sourceId, ghost, sourceCard: card, pointerDrag, copy:e.button === 2, width: r.width, height: r.height };
    document.body.classList.toggle('automatic-game-drag', !!source.IsAutomatic);
    // A origem não encolhe enquanto a prévia muda de destino: isso deslocaria
    // todas as tiers abaixo e poderia limitar o scroll antes de terminar o arraste.
    clickMove.sourceRow = card.closest('.tier-row') || card.closest('.timeline-year');
    if (clickMove.sourceRow) {
        clickMove.sourceRowMinHeight = clickMove.sourceRow.style.minHeight;
        clickMove.sourceRow.style.minHeight = clickMove.sourceRow.getBoundingClientRect().height + 'px';
    }
    card.classList.add('click-move-source');
    card.classList.add('move-source-hidden');
    ghost.style.left = (e.clientX || (r.left + r.width / 2)) + 'px';
    ghost.style.top = (e.clientY || (r.top + r.height / 2)) + 'px';
    document.body.classList.add('click-move-active');
    moveCursor = { x: e.clientX, y: e.clientY };
    moveFrame = requestAnimationFrame(followMoveCursor);
}

function cancelDoubleClickMove() {
    if (!clickMove) return;
    if (clickMove.ghost) clickMove.ghost.remove();
    clearClickMoveVisuals();
    if (clickMove.sourceRow) clickMove.sourceRow.style.minHeight = clickMove.sourceRowMinHeight;
    document.body.classList.remove('click-move-active');
    document.body.classList.remove('automatic-game-drag');
    clickMove = null;
    cancelAnimationFrame(moveFrame);
    moveFrame = 0;
    moveCursor = null;
}

function getGameMoveTarget(x, y) {
    if (!clickMove) return null;
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    if (el.closest?.('#game-remove-zone')) return clickMove.sourceId === ALL_GAMES_LIST_ID ? null : { region:'remove' };

    const card = el.closest ? el.closest('.game-card') : null;
    const sidebarItem = el.closest ? el.closest('.list-item') : null;
    const holder = el.closest ? (el.closest('[data-list-id]') || el.closest('.tier-row')?.querySelector('.tier-games') || el.closest('.timeline-year')?.querySelector('.tier-games')) : null;

    if (sidebarItem && !card) {
        const targetId = sidebarItem.dataset.listId;
        const target = getListById(rootData.Lists, targetId);
        if (!target || target.IsAutomatic || targetId === clickMove.sourceId) return null;
        return { toId: targetId, targetId: null, after: false, region: 'sidebar' };
    }

    if (!holder) return null;
    const toId = holder.dataset.listId;
    const to = getListById(rootData.Lists, toId);
    if (!to || to.IsAutomatic) return null;
    const slot = el.closest?.('.card-drop-slot');
    if (slot?.moveTarget) return slot.moveTarget;

    if (card?.dataset.id === clickMove.id) return null;
    // Coordenadas anteriores ao deslocamento evitam oscilação ao abrir o espaço.
    const insertion = nearestInsertionCard(holder, x, y);
    return { toId, ...(insertion || { targetId: null, after: false }), region: 'content', year:holder.dataset.year };
}

function updateDoubleClickMoveTarget(x, y) {
    const area = document.getElementById('content-area');
    const scrollTop = area.scrollTop;
    const horizontal = Array.from(document.querySelectorAll('.tier-games.horizontal-scroll[data-list-id], .timeline-horizontal'))
        .map(el => ({ el, left: el.scrollLeft }));
    try {
        updateDropPreview(x, y);
    } finally {
        // Remover o espaço antigo pode limitar o scroll antes de inserir o novo.
        // Restaura na mesma tarefa, após o layout final da prévia.
        area.scrollTop = scrollTop;
        horizontal.forEach(({ el, left }) => { el.scrollLeft = left; });
    }
}

function updateDropPreview(x, y) {
    if (!clickMove) return;
    const target = getGameMoveTarget(x, y);
    if (!target) { clearDropPreview(); return; }
    const key = `${target.region}:${target.toId}:${target.year}:${target.targetId}:${target.after}`;
    const changed = key !== dropPreviewKey;
    if (changed) { clearDropPreview(); dropPreviewKey = key; }
    if (target.region === 'remove') {
        document.getElementById('game-remove-zone').classList.add('active');
        return;
    }
    if (target.region === 'sidebar') {
        if (changed) document.querySelector(`.lists-container .list-item[data-list-id="${CSS.escape(target.toId)}"]`)?.classList.add('click-move-target');
        return;
    }
    const yearSelector = target.year === undefined ? '' : `[data-year="${CSS.escape(target.year)}"]`;
    const holder = document.querySelector(`#content-area [data-list-id="${CSS.escape(target.toId)}"]${yearSelector}`);
    if (!holder) return;
    const targetEl = target.targetId ? holder.querySelector(`.game-card[data-id="${CSS.escape(target.targetId)}"]`) : null;
    if (changed) {
        const slot = document.createElement('div');
        slot.className = 'card-drop-slot';
        slot.style.width = (clickMove.width || cardZoom) + 'px';
        slot.style.height = (clickMove.height || cardZoom * 1.4) + 'px';
        slot.moveTarget = target;
        holder.insertBefore(slot, targetEl ? (target.after ? targetEl.nextSibling : targetEl) : null);
    }
}

function commitDoubleClickMove(target) {
    if (!clickMove || !target) return false;
    const from = getListById(rootData.Lists, clickMove.sourceId);
    if (target.region === 'remove') {
        if (from?.IsAutomatic || !from?.GameIds?.includes(clickMove.id)) return false;
        from.GameIds = from.GameIds.filter(id => id !== clickMove.id);
        if (from.TimelineYears) delete from.TimelineYears[clickMove.id];
        cancelDoubleClickMove();
        markDirty();
        renderSidebar();
        if (currentListId) selectList(currentListId, true);
        return true;
    }
    const to = getListById(rootData.Lists, target.toId);
    if (!from || !to || to.IsAutomatic) return false;
    if (clickMove.id === target.targetId) return false;
    if (!from.GameIds?.includes(clickMove.id)) return false;
    if (target.targetId && !to.GameIds?.includes(target.targetId)) return false;
    const copying = from.IsAutomatic || (clickMove.copy && from !== to);
    if (clickMove.copy && from !== to && !confirm(`Copiar "${gameName(clickMove.id)}" para a lista "${to.Name || ''}"?`)) return false;
    const displayed = getListById(rootData.Lists, currentListId);
    const grouped = displayed && ['Tier','Timeline'].includes(listView(displayed));
    const sortOwner = grouped ? displayed : to;
    if (from === to && normalizeSortMode(sortOwner.SortOrder) !== 'Manual') {
        // Converte a ordem completa, inclusive jogos ocultos pela busca, antes de reordenar.
        const affected = grouped ? [...(sortOwner.Children || []), sortOwner] : [sortOwner];
        affected.forEach(list => { list.GameIds = getSortedGameIds(list, sortOwner.SortOrder, false); });
        sortOwner.SortOrder = 'Manual';
    }

    const scrollPositions = captureTierScrollPositions();
    from.GameIds = from.GameIds || [];
    to.GameIds = to.GameIds || [];
    const oldIndex = from.GameIds.indexOf(clickMove.id);
    if (oldIndex < 0) return false;
    let insertIndex = to.GameIds.length;
    if (target.targetId) {
        const ti = to.GameIds.indexOf(target.targetId);
        if (ti < 0) return false;
        insertIndex = ti + (target.after ? 1 : 0);
    }
    if (!copying) from.GameIds.splice(oldIndex, 1);
    if (from === to && oldIndex < insertIndex) insertIndex--;
    insertIndex -= to.GameIds.slice(0, insertIndex).filter(id => id === clickMove.id).length;
    to.GameIds = to.GameIds.filter(id => id !== clickMove.id);
    insertIndex = Math.min(insertIndex, to.GameIds.length);
    to.GameIds.splice(insertIndex, 0, clickMove.id);
    if (from !== to && !copying && from.TimelineYears) delete from.TimelineYears[clickMove.id];
    markDirty();
    renderSidebar();
    if (currentListId) selectList(currentListId, true);
    restoreTierScrollPositions(scrollPositions);
    cancelDoubleClickMove();
    return true;
}

function initDoubleClickMove() {
    if (clickMoveInitialized) return;
    clickMoveInitialized = true;

    let pressed = null;
    let suppressTouchClick = false;
    let suppressDragContextMenu = false;
    document.addEventListener('pointerdown', e => {
        // A fresh pointer gesture re-enables ordinary list context menus.
        suppressDragContextMenu = false;
        const tier = e.target.closest?.('.tier-games.horizontal-scroll') || e.target.closest?.('.timeline-horizontal');
        stopHorizontalAnimation(tier);
        if (cfgInteractionMode !== 'drag' || ![0, 2].includes(e.button) || clickMove) return;
        const card = e.target.closest?.('#content-area .game-card');
        if (!card) return;
        pressed = { card, x: e.clientX, y: e.clientY, lastX: e.clientX, lastY: e.clientY, id: e.pointerId, touch: e.pointerType === 'touch', event: e };
        card.setPointerCapture(e.pointerId);
        if (pressed.touch) pressed.timer = setTimeout(() => {
            if (pressed && !pressed.panning) startDoubleClickMove(pressed.card, pressed.event, true);
        }, 350);
    });
    document.addEventListener('pointermove', e => {
        if (!pressed || e.pointerId !== pressed.id || clickMove) return;
        if (pressed.touch) {
            const dx = e.clientX - pressed.x, dy = e.clientY - pressed.y;
            if (!pressed.panning && Math.hypot(dx, dy) < 8) return;
            if (!pressed.panning) {
                clearTimeout(pressed.timer);
                pressed.panning = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
            }
            const tier = pressed.card.closest('.tier-games.horizontal-scroll') || pressed.card.closest('.timeline-horizontal');
            if (pressed.panning === 'horizontal' && tier) tier.scrollLeft -= e.clientX - pressed.lastX;
            else document.getElementById('content-area').scrollTop -= e.clientY - pressed.lastY;
            pressed.lastX = e.clientX; pressed.lastY = e.clientY;
            e.preventDefault();
            return;
        }
        if (Math.hypot(e.clientX - pressed.x, e.clientY - pressed.y) < 8) return;
        startDoubleClickMove(pressed.card, e, true);
        if (clickMove) clickMove.copy = pressed.event.button === 2;
        if (clickMove?.copy) {
            suppressDragContextMenu = true;
            document.getElementById('ctx-menu').style.display = 'none';
        }
    });
    document.addEventListener('pointerup', e => {
        if (!pressed || e.pointerId !== pressed.id) return;
        const card = pressed.card;
        clearTimeout(pressed.timer);
        if (pressed.panning) {
            suppressTouchClick = true;
            setTimeout(() => { suppressTouchClick = false; }, 250);
        }
        pressed = null;
        if (card.hasPointerCapture(e.pointerId)) card.releasePointerCapture(e.pointerId);
        if (!clickMove?.pointerDrag) return;
        const target = getGameMoveTarget(e.clientX, e.clientY);
        if (target) commitDoubleClickMove(target);
        cancelDoubleClickMove();
    });
    document.addEventListener('pointercancel', () => { clearTimeout(pressed?.timer); pressed = null; if (clickMove?.pointerDrag) cancelDoubleClickMove(); });
    window.addEventListener('blur', () => { clearTimeout(pressed?.timer); pressed = null; cancelDoubleClickMove(); });
    document.addEventListener('contextmenu', e => {
        // Browsers may emit this on the destination after pointerup and after
        // the copy confirmation, when clickMove has already been cleared.
        if (suppressDragContextMenu) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return;
        }
        if (cfgInteractionMode === 'drag' && e.target.closest?.('#content-area .game-card')) e.preventDefault();
    }, true);

    document.addEventListener('dblclick', e => {
        if (cfgInteractionMode !== 'double') return;
        const card = e.target.closest ? e.target.closest('.game-card') : null;
        if (!card) return;
        e.preventDefault();
        e.stopPropagation();
        if (!clickMove) startDoubleClickMove(card, e);
    });

    document.addEventListener('pointermove', e => {
        if (!clickMove) return;
        moveCursor = { x: e.clientX, y: e.clientY };
        clickMove.ghost.style.left = e.clientX + 'px';
        clickMove.ghost.style.top = e.clientY + 'px';
        updateDoubleClickMoveTarget(e.clientX, e.clientY);
    }, { passive: true });

    document.addEventListener('click', e => {
        if (suppressTouchClick) { e.preventDefault(); e.stopPropagation(); return; }
        if (!clickMove) return;
        if (clickMove.pointerDrag) return;
        if (e.target.closest && e.target.closest('#setup-modal, #edit-modal, #sidebar-toggle, .sidebar-settings, input, select, button')) return;
        const target = getGameMoveTarget(e.clientX, e.clientY);
        // Qualquer clique fora de um destino válido, inclusive no próprio jogo, cancela.
        if (!target || target.targetId === clickMove.id) {
            e.preventDefault();
            e.stopPropagation();
            cancelDoubleClickMove();
            return;
        }
        e.preventDefault();
        e.stopPropagation();
        commitDoubleClickMove(target);
    }, true);

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && clickMove) cancelDoubleClickMove();
    });
}

initDoubleClickMove();

// ──────────────────────────────────────────────
// Save to Supabase
// ──────────────────────────────────────────────
// Edições são salvas automaticamente; falhas mantêm a edição pendente.
async function syncToSupabase(manual = true) {
    clearTimeout(saveTimer);
    const state = editState();
    if (saving) { resaveAfter = state !== inFlightEditState; return; }
    if (!dirty || (savedEditState !== null && state === savedEditState)) {
        dirty = false;
        resaveAfter = false;
        return;
    }
    saving = true;
    inFlightEditState = state;
    inFlightRevision = ++saveSequence;
    const ind = document.getElementById('loading-indicator');
    ind.style.display = 'block';
    ind.textContent = 'Salvando...';
    if (playniteLocal) {
        const request = inFlightRevision;
        saveWatchdog = setTimeout(() => {
            if (saving && inFlightRevision === request) {
                saving = false;
                ind.textContent = 'Gravação não confirmada. Atualize antes de continuar.';
                console.error('Playnite não confirmou o envio', request);
            }
        }, 15000);
        try {
            // Serializa antes de aguardar o binding: edições durante o envio ficam para o próximo.
            const json = JSON.stringify({ Type: 'save', BaseUpdatedAt: hostStamp,
                Revision: request, Data: { Lists: rootData.Lists, Settings: rootData.Settings } });
            const result = JSON.parse(await sendPlayniteRequest(json));
            window.playniteSaveResult(request, result.UpdatedAt, result.Ok === true);
        } catch (error) {
            console.error(error);
            window.playniteSaveResult(request, hostStamp, false);
        }
        return;
    }
    let ok = false;
    try {
        if (!rootData.UpdatedAt) rootData.UpdatedAt = Date.now();
        const stamp = rootData.UpdatedAt;
        // Campos internos de interface (_expanded) não vão para a nuvem.
        const payload = JSON.parse(JSON.stringify(rootData, (k, v) => (k.startsWith('_') ? undefined : v)));
        let cleanUrl = url.replace(/\/$/, '');
        const res = await fetch(`${cleanUrl}/rest/v1/playnite_lists?on_conflict=id`, {
            method: 'POST',
            headers: { 'apikey': key, 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ id: 'my_playnite_lists', lists_json: payload })
        });
        if (!res.ok) throw new Error('POST failed');
        ok = true;
        savedEditState = state;
        // Só considera salvo se não houve nova edição durante o envio.
        if (rootData.UpdatedAt === stamp) dirty = false;
    } catch (e) {
        console.error(e);
        if (manual) alert('Erro ao salvar no Supabase.');
        else { clearTimeout(saveTimer); saveTimer = setTimeout(() => syncToSupabase(false), 5000); } // tenta de novo
    }
    saving = false;
    setTimeout(() => { if (!saving) ind.style.display = 'none'; ind.textContent = 'Sincronizando...'; }, ok ? 800 : 0);
    if (resaveAfter) { resaveAfter = false; if (dirty) syncToSupabase(false); }
}

async function sendPlayniteRequest(json) {
    await CefSharp.BindObjectAsync('playniteBridge');
    return window.playniteBridge.send(json);
}

window.requestPlayniteData = async () => {
    if (!playniteLocal) return;
    try {
        const data = JSON.parse(await sendPlayniteRequest(JSON.stringify({ Type: 'ready' })));
        window.receivePlayniteData(data);
    } catch (error) {
        console.error('Falha ao consultar o Playnite', error);
    }
};

window.receivePlayniteData = data => {
    if (!playniteLocal || dirty || saving || clickMove) return;
    clearTimeout(saveWatchdog);
    document.getElementById('loading-indicator').style.display = 'none';
    const expanded = collectExpanded(rootData.Lists || []);
    rootData = data;
    applyExpanded(rootData.Lists || [], expanded);
    savedEditState = editState(data);
    hostStamp = data.UpdatedAt || 0;
    applySharedDisplaySettings(data.Settings || {});
    gamesMap = {};
    (data.Games || []).forEach(g => gamesMap[g.Id] = g);
    applySettings();
    renderSidebar();
    const id = getListById(data.Lists, currentListId)?.Id || data.Lists[0]?.Id || ALL_GAMES_LIST_ID;
    if (id) selectList(id, true);
    else {
        currentListId = null;
        document.getElementById('content-area').innerHTML = '';
        document.getElementById('main-header').style.visibility = 'hidden';
    }
};

window.playniteSaveResult = (revision, stamp, ok) => {
    if (Number(revision) !== Number(inFlightRevision)) return;
    clearTimeout(saveWatchdog);
    saving = false;
    const ind = document.getElementById('loading-indicator');
    ind.style.display = 'none';
    if (!ok) {
        ind.style.display = 'block';
        ind.textContent = 'Não foi possível salvar. Atualize antes de continuar.';
        alert('Não foi possível salvar nas listas locais. Verifique o log do Playnite; se as listas mudaram em outra tela, recarregue a página antes de repetir.');
        return;
    }
    hostStamp = stamp;
    savedEditState = inFlightEditState;
    dirty = editState() !== savedEditState;
    if (!dirty) rootData.UpdatedAt = stamp;
    resaveAfter = false;
    if (dirty) syncToSupabase(false);
    else window.requestPlayniteData();
};
</script>
</body>
