<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Listas - Playnite Web</title>
    <link id="font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #0F111A;
            --panel: #161925;
            --card: #1F2332;
            --card-hover: #2A2F42;
            --text: #EEF0F7;
            --dim: #8A91A8;
            --accent: #8B7CFF;
            --accent-soft: rgba(139, 124, 255, 0.2);
            --border: #2A2F42;
            --font-family: 'Inter', sans-serif;
            --card-width: 140px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--card-hover); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(10px); }
        .modal-content { background: var(--panel); border-radius: 12px; padding: 24px; width: 460px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 20px; font-weight: 600; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { cursor: pointer; color: var(--dim); font-size: 20px; background: none; border: none; color: var(--dim); }
        .close-btn:hover { color: var(--text); }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
        .input-group input[type="text"], .input-group select { width: 100%; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: inherit; outline: none; font-size: 13px; }
        .input-group input[type="text"]:focus { border-color: var(--accent); }
        .toggle-group { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; }
        .toggle-group input { margin-right: 10px; cursor: pointer; width: 15px; height: 15px; accent-color: var(--accent); }
        .toggle-group label { font-size: 13px; cursor: pointer; }
        .section-title { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 12px; }
        .modal-section { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .modal-section:last-child { border-bottom: none; margin-bottom: 0; }
        .btn { background: var(--accent); color: #10121A; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; width: 100%; font-family: inherit; font-size: 14px; }
        .btn:hover { opacity: 0.9; }
        .btn-sm { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 12px; }
        .btn-sm:hover { background: var(--card-hover); }
        .btn-danger { background: rgba(220,50,50,0.2); color: #ff6b6b; border: 1px solid rgba(220,50,50,0.3); }
        .btn-danger:hover { background: rgba(220,50,50,0.35); }

        /* Sidebar */
        .sidebar { width: 310px; background: var(--panel); display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: width 0.18s ease; overflow: hidden; flex-shrink: 0; }
        .sidebar.collapsed { width: 48px; }
        .sidebar.collapsed .sidebar-title, .sidebar.collapsed .lists-container { display: none; }
        .sidebar.collapsed .sidebar-header { padding: 8px 6px; justify-content: center; }
        .sidebar.collapsed .sidebar-actions { width: 100%; justify-content: center; }
        .sidebar.collapsed .sidebar-settings { display: none; }
        .sidebar-toggle { flex-shrink: 0; width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
        .sidebar-header { padding: 18px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { font-size: 16px; font-weight: 700; }
        .lists-container { flex: 1; overflow-y: auto; padding: 8px 8px; }

        .list-group { }
        .list-item {
            padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center;
            margin-bottom: 1px; border: 1px solid transparent; user-select: none;
        }
        .list-item:hover { background: var(--card); }
        .list-item.active { background: var(--card); border-color: var(--border); }
        .list-item.drag-over { background: var(--accent-soft) !important; border-color: var(--accent) !important; }
        .list-item .chevron { width: 16px; font-size: 10px; color: var(--dim); flex-shrink: 0; transition: transform 0.15s; cursor: pointer; text-align: center; }
        .list-item .chevron.open { transform: rotate(90deg); }
        .list-item .chevron.empty { visibility: hidden; }
        .list-color { width: 9px; height: 9px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }
        .list-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
        .list-count { font-size: 10px; color: var(--dim); background: var(--bg); padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
        .list-children { overflow: hidden; }
        .list-ctx-menu { position: fixed; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.4); min-width: 180px; }
        .list-ctx-menu .item { padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .list-ctx-menu .item:hover { background: var(--card-hover); }
        .list-ctx-menu .item.danger { color: #ff6b6b; }
        .list-ctx-menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

        /* Color palette */
        .color-palette { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .color-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; }
        .color-dot:hover { transform: scale(1.2); }
        .color-dot.selected { border-color: white; }

        /* Main */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .main-header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .main-header-left { display: flex; align-items: center; }
        .main-header h2 { font-size: 22px; font-weight: 700; }
        .header-subtitle { color: var(--dim); font-size: 12px; margin-top: 3px; }
        .header-color { width: 5px; height: 36px; border-radius: 3px; margin-right: 14px; flex-shrink: 0; }
        .actions { display: flex; gap: 10px; align-items: center; }
        .current-search { width: 190px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; font-family: inherit; font-size: 12px; }
        .current-search:focus { border-color: var(--accent); }
        .sort-select { padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; font-family: inherit; font-size: 12px; }
        .sortable-ghost { opacity: 0.32 !important; }
        .sortable-chosen { box-shadow: 0 0 0 2px var(--accent-soft); }
        /* Touch mode: só é ativado quando o usuário escolhe Touch nas configurações.
           O modo padrão (mouse/teclado) permanece visual e comportamentalmente igual. */
        body.touch-mode { -webkit-tap-highlight-color: transparent; }
        body.touch-mode .game-card { cursor: grab; user-select: none; -webkit-user-select: none; }
        body.touch-mode .list-item { user-select: none; -webkit-user-select: none; }
        body.touch-mode .content-area { overscroll-behavior: contain; }
        body.touch-mode .sidebar, body.touch-mode .lists-container { overscroll-behavior: contain; }
        .touch-drag-ghost { position: fixed; z-index: 3000; pointer-events: none; opacity: .82; transform: translate(-50%, -50%) scale(.96); box-shadow: 0 16px 36px rgba(0,0,0,.45); border-radius: 8px; }
        .touch-drop-line { position: fixed; z-index: 2999; pointer-events: none; height: 3px; background: var(--accent); border-radius: 3px; box-shadow: 0 0 8px rgba(139,124,255,.55); display: none; }
        .touch-drag-active { cursor: grabbing !important; }
        .touch-source-hidden { opacity: .18 !important; }
        body.touch-mode.touch-dragging * { touch-action: none !important; }

        .zoom-slider { width: 90px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; }
        .btn-outline:hover { background: var(--card); }
        .btn-outline.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
        .content-area { flex: 1; overflow-y: auto; padding: 24px 28px; }

        /* Grid */
        .games-grid { display: flex; flex-wrap: wrap; gap: 16px; align-content: flex-start; }

        /* Tier rows */
        .tier-row { margin-bottom: 16px; background: var(--panel); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: flex; min-height: 130px; }
        .tier-header { width: var(--tier-header-width, 90px); flex: 0 0 var(--tier-header-width, 90px); display: flex; align-items: center; justify-content: center; padding: 12px; font-weight: 700; font-size: 15px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.4); word-break: break-word; }
        .tier-games { flex: 1; padding: 12px; display: flex; gap: 10px; flex-wrap: wrap; min-height: 120px; min-width: 0; }
        .tier-games.horizontal-scroll { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
        .tier-row.pending-tier .tier-header { background: #555B6E !important; color: #fff !important; }

        /* Game Card */
        .game-card { background: var(--card); border-radius: 8px; overflow: hidden; width: var(--card-width); flex-shrink: 0; border: 1px solid transparent; cursor: grab; position: relative; transition: transform 0.15s, box-shadow 0.15s; }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.35); border-color: var(--border); }
        .game-cover { height: calc(var(--card-width) * 1.4); background: #2D3243; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.15); background-size: cover; background-position: center; }
        .metacritic { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; background: rgba(0,0,0,0.75); color: white; border: 2px solid; }
        .meta-green { border-color: #6c3; }
        .meta-yellow { border-color: #fc3; }
        .meta-red { border-color: #f55; }
        .game-info { padding: 9px 10px 10px; }
        .game-title { font-weight: 600; font-size: 12px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-platform { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .list-item { position: relative; }
        .list-item.dragging { opacity: .35; }
        .list-item.drag-before::before, .list-item.drag-after::after { content: ''; position: absolute; left: 6px; right: 6px; height: 3px; background: var(--accent); border-radius: 3px; pointer-events: none; }
        .list-item.drag-before::before { top: -2px; }
        .list-item.drag-after::after { bottom: -2px; }
        .list-item.drag-into { outline: 2px solid var(--accent); outline-offset: -2px; background: rgba(139,124,255,.12); }

        .loading { display: none; position: fixed; top: 16px; right: 16px; background: var(--accent); color: #10121A; padding: 7px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; animation: pulse 1.5s infinite; z-index: 2000; }
        @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    </style>
</head>
<body>
<div class="loading" id="loading-indicator">Sincronizando...</div>

<!-- Settings Modal -->
<div class="modal" id="setup-modal">
    <div class="modal-content">
        <h2>Configurações <button class="close-btn" id="close-setup" style="display:none" onclick="document.getElementById('setup-modal').style.display='none'">✕</button></h2>

        <div class="modal-section">
            <div class="section-title">Supabase</div>
            <div class="input-group"><label>URL do Projeto</label><input type="text" id="supa-url" placeholder="https://xyz.supabase.co"></div>
            <div class="input-group"><label>API Key (anon)</label><input type="text" id="supa-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></div>
        </div>

        <div class="modal-section">
            <div class="section-title">Interface</div>
            <div class="toggle-group"><input type="checkbox" id="cfg-meta"><label for="cfg-meta">Mostrar nota Metacritic nas capas</label></div>
            <div class="input-group"><label>Layout dos jogos nas tiers</label><select id="cfg-tier-layout"><option value="Wrap">Quebrar linha</option><option value="HorizontalScroll">Scroll horizontal</option></select></div>
            <div class="input-group"><label>Modo de navegação</label><select id="cfg-input-mode"><option value="mouse">Mouse / teclado (padrão)</option><option value="touch">Touch</option></select></div>
            <div class="input-group"><label>Fonte da Interface</label><input type="text" id="cfg-font" placeholder="Inter"></div>
        </div>

        <button class="btn" onclick="saveSetup()">Salvar e Recarregar</button>
    </div>
</div>

<!-- Edit List Modal -->
<div class="modal" id="edit-modal" style="display:none">
    <div class="modal-content">
        <h2>Editar Lista <button class="close-btn" onclick="document.getElementById('edit-modal').style.display='none'">✕</button></h2>
        <div class="modal-section">
            <div class="input-group"><label>Nome</label><input type="text" id="edit-name"></div>
            <div class="input-group">
                <label>Cor</label>
                <div class="color-palette" id="edit-colors"></div>
            </div>
        </div>
        <div style="display:flex; gap:8px; margin-top:4px;">
            <button class="btn" onclick="saveEditList()" style="flex:1">Salvar</button>
            <button class="btn-sm btn-danger" onclick="deleteList()" style="padding:10px 16px">Excluir</button>
        </div>
    </div>
</div>

<!-- Right-click context menu -->
<div id="ctx-menu" class="list-ctx-menu" style="display:none"></div>

<div class="sidebar">
    <div class="sidebar-header">
        <h1 class="sidebar-title">Minhas Listas</h1>
        <div class="sidebar-actions" style="display:flex;gap:6px;align-items:center">
            <button class="btn-sm sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" title="Recolher barra lateral">◀</button>
            <button class="btn-sm sidebar-settings" onclick="openSetup()">⚙</button>
        </div>
    </div>
    <div class="lists-container" id="lists-container"></div>
</div>

<div class="main-content">
    <div class="main-header" id="main-header" style="visibility:hidden">
        <div class="main-header-left">
            <div class="header-color" id="header-color"></div>
            <div>
                <h2 id="header-title"></h2>
                <div class="header-subtitle" id="header-count"></div>
            </div>
        </div>
        <div class="actions">
            <input class="current-search" id="current-search" type="text" placeholder="Buscar nesta lista" oninput="changeCurrentSearch(this.value)">
            <select class="sort-select" id="sort-select" onchange="changeSortMode(this.value)" title="Ordenação">
                <option value="Manual">Manual</option>
                <option value="Alphabetical">A-Z</option>
                <option value="Metacritic">Metacritic</option>
            </select>
            <button class="btn-outline" id="btn-tier-toggle" onclick="toggleTierList()" style="display:none">⊞ Tier List</button>
            <input type="range" class="zoom-slider" id="zoom-slider" min="80" max="240" value="140" oninput="changeZoom(this.value)" title="Zoom das capas">
            <button class="btn-outline" onclick="syncToSupabase()">💾 Salvar</button>
        </div>
    </div>
    <div class="content-area" id="content-area"></div>
</div>

<script>
const PALETTE = ['#8B7CFF','#3DCB7F','#F2B84B','#E05C5C','#5C9EE0','#E05CAD','#5CE0CB','#A0A0A0','#C45CE0','#E08A5C'];
const TIER_PALETTE = ['#FF7F7F','#FFBF7F','#FFDF7F','#FFFF7F','#BFFF7F','#7FFF7F','#7FFFFF','#7FBFFF','#7F7FFF','#FF7FFF','#BF7FBF','#3B3B3B','#858585','#CFCFCF','#F7F7F7'];

let url = localStorage.getItem('supaUrl') || '';
let key = localStorage.getItem('supaKey') || '';
let cfgMeta = localStorage.getItem('cfgMeta') !== 'false';
let cfgFont = localStorage.getItem('cfgFont') || 'Inter';
let cfgTierLayout = localStorage.getItem('cfgTierLayout') || 'Wrap';
let cfgInputMode = localStorage.getItem('cfgInputMode') || 'mouse';
let sidebarCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
let draggedGameId = null;
let draggedGameFromId = null;
let cardZoom = parseInt(localStorage.getItem('cardZoom') || '140');

let rootData = { Lists: [], Games: [], Settings: {} };
let gamesMap = {};
let currentListId = null;
let currentSearch = '';
let sortables = [];
let lastDataString = '';
let editingListId = null;
let dirty = false;          // há edição local ainda não enviada
let saving = false;         // envio em andamento
let resaveAfter = false;    // houve nova edição durante o envio
let saveTimer = null;
let draggedListId = null;
let draggedListNode = null;

// Toda alteração local passa por aqui: carimba, marca como pendente e salva sozinho (debounce).
function markDirty() {
    normalizeTierColors(rootData.Lists);
    rootData.UpdatedAt = Date.now();
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => syncToSupabase(false), 700);
}

window.addEventListener('beforeunload', e => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function applySettings() {
    document.documentElement.style.setProperty('--font-family', `${cfgFont}, sans-serif`);
    if (cfgFont && cfgFont !== 'Inter') {
        document.getElementById('font-link').href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cfgFont)}:wght@400;500;600;700&display=swap`;
    }
    document.documentElement.style.setProperty('--card-width', `${cardZoom}px`);
    document.getElementById('zoom-slider').value = cardZoom;
    document.body.classList.toggle('touch-mode', cfgInputMode === 'touch');
    applySidebarState();
    const inputMode = document.getElementById('cfg-input-mode');
    if (inputMode) inputMode.value = cfgInputMode;
}

function changeZoom(v) {
    cardZoom = parseInt(v);
    document.documentElement.style.setProperty('--card-width', `${v}px`);
    localStorage.setItem('cardZoom', v);
}

// Init
if (url && key) {
    document.getElementById('setup-modal').style.display = 'none';
    document.getElementById('close-setup').style.display = 'block';
    applySettings();
    loadData(false);
    setInterval(() => loadData(true), 15000);
} else {
    document.getElementById('setup-modal').style.display = 'flex';
}

// Close ctx menu on any click
document.addEventListener('click', () => document.getElementById('ctx-menu').style.display = 'none');

function openSetup() {
    document.getElementById('supa-url').value = url;
    document.getElementById('supa-key').value = key;
    document.getElementById('cfg-meta').checked = cfgMeta;
    document.getElementById('cfg-font').value = cfgFont;
    document.getElementById('cfg-tier-layout').value = cfgTierLayout;
    const inputMode = document.getElementById('cfg-input-mode');
    if (inputMode) inputMode.value = cfgInputMode;
    document.getElementById('setup-modal').style.display = 'flex';
    document.getElementById('close-setup').style.display = 'block';
}

function saveSetup() {
    url = document.getElementById('supa-url').value.trim();
    key = document.getElementById('supa-key').value.trim();
    cfgMeta = document.getElementById('cfg-meta').checked;
    cfgFont = document.getElementById('cfg-font').value.trim() || 'Inter';
    cfgTierLayout = document.getElementById('cfg-tier-layout').value || 'Wrap';
    cfgInputMode = document.getElementById('cfg-input-mode').value === 'touch' ? 'touch' : 'mouse';
    localStorage.setItem('supaUrl', url);
    localStorage.setItem('supaKey', key);
    localStorage.setItem('cfgMeta', cfgMeta);
    localStorage.setItem('cfgFont', cfgFont);
    localStorage.setItem('cfgTierLayout', cfgTierLayout);
    localStorage.setItem('cfgInputMode', cfgInputMode);
    if (rootData && rootData.Settings) rootData.Settings.TierLayoutMode = cfgTierLayout;
    applySettings();
    document.getElementById('setup-modal').style.display = 'none';
    if (url && key) loadData(false);
}

function collectExpanded(lists, map = {}) {
    (lists || []).forEach(l => {
        if (l._expanded === false) map[l.Id] = false;
        collectExpanded(l.Children, map);
    });
    return map;
}

function applyExpanded(lists, map) {
    (lists || []).forEach(l => {
        if (map[l.Id] === false) l._expanded = false;
        applyExpanded(l.Children, map);
    });
}

async function loadData(isAuto) {
    // Edição local pendente ou envio em andamento: a nuvem ainda não tem as alterações, então
    // recarregar agora desfaria o que o usuário acabou de fazer.
    if (isAuto && (dirty || saving)) return;
    if (!isAuto) document.getElementById('loading-indicator').style.display = 'block';
    try {
        let cleanUrl = url.replace(/\/$/, '');
        const res = await fetch(`${cleanUrl}/rest/v1/playnite_lists?id=eq.my_playnite_lists`, {
            headers: { 'apikey': key, 'Authorization': `Bearer ${key}` }
        });
        const data = await res.json();
        if (data && data.length > 0 && data[0].lists_json) {
            // O usuário pode ter editado enquanto a requisição estava em andamento.
            if (isAuto && (dirty || saving)) return;

            const raw = typeof data[0].lists_json === 'string' ? data[0].lists_json : JSON.stringify(data[0].lists_json);
            let parsed = typeof data[0].lists_json === 'string' ? JSON.parse(data[0].lists_json) : data[0].lists_json;
            if (parsed.Settings && parsed.Settings.TierLayoutMode) {
                cfgTierLayout = parsed.Settings.TierLayoutMode === 'HorizontalScroll' ? 'HorizontalScroll' : 'Wrap';
                localStorage.setItem('cfgTierLayout', cfgTierLayout);
            }
            const colorsChanged = normalizeTierColors(parsed.Lists);

            if (isAuto) {
                const cloudStamp = parsed.UpdatedAt || 0;
                const localStamp = rootData.UpdatedAt || 0;
                if (cloudStamp) { if (cloudStamp <= localStamp) return; }      // nada novo
                else if (raw === lastDataString) return;                        // dados antigos sem carimbo
            }
            lastDataString = raw;

            const expanded = collectExpanded(rootData.Lists);
            const scrollTop = document.getElementById('content-area').scrollTop;
            rootData = parsed;
            applyExpanded(rootData.Lists, expanded);
            gamesMap = {};
            (rootData.Games || []).forEach(g => gamesMap[g.Id] = g);
            let prevId = currentListId;
            renderSidebar();
            if (prevId && getListById(rootData.Lists, prevId)) selectList(prevId);
            else if (rootData.Lists && rootData.Lists.length > 0) selectList(rootData.Lists[0].Id);
            document.getElementById('content-area').scrollTop = scrollTop;
            if (colorsChanged) markDirty();
        }
    } catch (e) {
        if (!isAuto) { alert('Erro ao carregar do Supabase.'); openSetup(); }
    }
    if (!isAuto) document.getElementById('loading-indicator').style.display = 'none';
}

// ──────────────────────────────────────────────
// List tree helpers
// ──────────────────────────────────────────────
function getListById(lists, id) {
    for (let l of lists) {
        if (l.Id === id) return l;
        if (l.Children && l.Children.length) { let f = getListById(l.Children, id); if (f) return f; }
    }
    return null;
}

function countGames(list) {
    let c = list.GameIds ? list.GameIds.length : 0;
    if (list.Children) list.Children.forEach(ch => c += countGames(ch));
    return c;
}

function findParent(lists, id, parent = null) {
    for (let l of lists) {
        if (l.Id === id) return parent;
        if (l.Children) { let f = findParent(l.Children, id, l); if (f !== undefined) return f; }
    }
    return undefined;
}

// ──────────────────────────────────────────────
// Ordenação e pesquisa da lista atual
// ──────────────────────────────────────────────
function normalizeSortMode(mode) {
    // O Playnite pode serializar o enum como número, string numérica ou nome.
    // A WebApp precisa aceitar todas as três formas para manter a ordenação
    // compatível com a extensão.
    if (typeof mode === 'number' && Number.isFinite(mode)) {
        return ['Manual', 'Alphabetical', 'Metacritic'][mode] || 'Manual';
    }
    if (mode && typeof mode === 'object') {
        // Alguns serializers expõem enums como { value__: 1 }.
        if (Number.isFinite(mode.value__)) return ['Manual', 'Alphabetical', 'Metacritic'][mode.value__] || 'Manual';
        if (mode.Value !== undefined) return normalizeSortMode(mode.Value);
    }
    if (mode === null || mode === undefined || mode === '') return 'Manual';

    const m = String(mode).trim();
    if (/^\d+$/.test(m)) {
        return ['Manual', 'Alphabetical', 'Metacritic'][Number(m)] || 'Manual';
    }

    const lower = m.toLowerCase();
    if (lower === 'alphabetical' || lower === 'alphabetic' || lower.includes('alphabet') || lower.includes('a-z')) return 'Alphabetical';
    if (lower === 'metacritic' || lower.includes('meta')) return 'Metacritic';
    return 'Manual';
}

const sortCollator = new Intl.Collator('pt-BR', {
    sensitivity: 'base',
    numeric: true,
    ignorePunctuation: true
});

function gameName(id) {
    const g = gamesMap[id];
    return String(g?.Name ?? g?.name ?? '');
}

function gameScore(id) {
    const g = gamesMap[id];
    // Supabase/JSON pode devolver números como strings.
    const value = g?.CriticScore ?? g?.criticScore ?? g?.Metacritic ?? g?.metacritic;
    if (value === null || value === undefined || value === '') return -1;
    const n = Number(value);
    return Number.isFinite(n) ? n : -1;
}

function getSortedGameIds(list, sortModeOverride = null) {
    let ids = Array.from(list?.GameIds || []);
    const mode = normalizeSortMode(sortModeOverride ?? list?.SortOrder);

    if (mode === 'Alphabetical') {
        ids.sort((a, b) => {
            const result = sortCollator.compare(gameName(a), gameName(b));
            return result !== 0 ? result : String(a).localeCompare(String(b));
        });
    } else if (mode === 'Metacritic') {
        ids.sort((a, b) => {
            const scoreDiff = gameScore(b) - gameScore(a);
            if (scoreDiff !== 0) return scoreDiff;
            const nameDiff = sortCollator.compare(gameName(a), gameName(b));
            return nameDiff !== 0 ? nameDiff : String(a).localeCompare(String(b));
        });
    }

    if (currentSearch.trim()) {
        const q = currentSearch.trim().toLocaleLowerCase();
        ids = ids.filter(id => gameName(id).toLocaleLowerCase().includes(q));
    }
    return ids;
}

function changeCurrentSearch(value) {
    currentSearch = value || '';
    selectList(currentListId, true);
}

function changeSortMode(value) {
    const list = getListById(rootData.Lists, currentListId);
    if (!list) return;
    list.SortOrder = value;
    markDirty();
    selectList(currentListId, true);
}

function normalizeTierColors(lists) {
    let changed = false;
    (lists || []).forEach(parent => {
        if (parent.IsTier && parent.Children && parent.Children.length) {
            parent.Children.forEach((child, i) => {
                const color = TIER_PALETTE[Math.min(i, TIER_PALETTE.length - 1)];
                if (child.HexColor !== color) { child.HexColor = color; changed = true; }
            });
        }
        if (parent.Children) changed = normalizeTierColors(parent.Children) || changed;
    });
    return changed;
}

// ──────────────────────────────────────────────
// Sidebar rendering
// ──────────────────────────────────────────────
function clearListDragVisuals() {
    document.querySelectorAll('.list-item.drag-before, .list-item.drag-after, .list-item.drag-into, .list-children.drag-into')
        .forEach(el => el.classList.remove('drag-before', 'drag-after', 'drag-into'));
}

function listDropMode(item, clientY) {
    const rect = item.getBoundingClientRect();
    const ratio = (clientY - rect.top) / Math.max(1, rect.height);
    if (ratio < 0.25) return 'before';
    if (ratio > 0.75) return 'after';
    return 'into';
}

function moveListNode(dragId, targetId, mode) {
    if (!dragId || !targetId || dragId === targetId) return;

    const dragged = getListById(rootData.Lists, dragId);
    const target = getListById(rootData.Lists, targetId);
    if (!dragged || !target) return;

    // Never allow moving a node into one of its descendants.
    let p = target;
    while (p) {
        if (p.Id === dragId) return;
        p = findParent(rootData.Lists, p.Id);
    }

    function removeNode(lists) {
        for (let i = 0; i < lists.length; i++) {
            if (lists[i].Id === dragId) return lists.splice(i, 1)[0];
            if (lists[i].Children) {
                const found = removeNode(lists[i].Children);
                if (found) return found;
            }
        }
        return null;
    }

    const node = removeNode(rootData.Lists);
    if (!node) return;

    if (mode === 'into') {
        if (!target.Children) target.Children = [];
        target.Children.push(node);
    } else {
        const parent = findParent(rootData.Lists, targetId);
        const siblings = parent ? (parent.Children || (parent.Children = [])) : rootData.Lists;
        const targetIndex = siblings.findIndex(x => x.Id === targetId);
        if (targetIndex < 0) { rootData.Lists.push(node); }
        else siblings.splice(mode === 'after' ? targetIndex + 1 : targetIndex, 0, node);
    }

    node._expanded = node._expanded !== false;
    markDirty();
    clearListDragVisuals();
    renderSidebar();
    if (currentListId) selectList(currentListId, true);
}

function applySidebarState() {
    const sidebar = document.querySelector('.sidebar');
    const btn = document.getElementById('sidebar-toggle');
    if (!sidebar) return;
    sidebar.classList.toggle('collapsed', sidebarCollapsed);
    if (btn) {
        btn.textContent = sidebarCollapsed ? '▶' : '◀';
        btn.title = sidebarCollapsed ? 'Expandir barra lateral' : 'Recolher barra lateral';
    }
}

function toggleSidebar() {
    sidebarCollapsed = !sidebarCollapsed;
    localStorage.setItem('sidebarCollapsed', sidebarCollapsed);
    applySidebarState();
}

function renderSidebar() {
    const c = document.getElementById('lists-container');
    c.innerHTML = '';
    renderListGroup(rootData.Lists || [], c, true);
}

function renderListGroup(lists, container, isRoot) {
    for (let list of lists) {
        const hasChildren = list.Children && list.Children.length > 0;
        const isExpanded = list._expanded !== false;

        const item = document.createElement('div');
        item.className = 'list-item' + (currentListId === list.Id ? ' active' : '');
        if (!isRoot) item.style.paddingLeft = '12px';

        item.innerHTML = `
            <span class="chevron ${hasChildren ? (isExpanded ? 'open' : '') : 'empty'}"
                  onclick="event.stopPropagation(); toggleExpand('${list.Id}')">▶</span>
            <div class="list-color" style="background:${list.HexColor || '#8B7CFF'}"></div>
            <div class="list-name" title="${esc(list.Name)}">${esc(list.Name)}</div>
            <div class="list-count">${countGames(list)}</div>
        `;
        item.draggable = cfgInputMode !== 'touch';
        item.addEventListener('click', () => selectList(list.Id));
        item.addEventListener('contextmenu', e => { e.preventDefault(); showCtxMenu(e, list); });

        // Jogos podem ser soltos diretamente em qualquer lista da árvore lateral.
        item.addEventListener('dragover', e => {
            // Alguns browsers não expõem DataTransfer.getData() durante dragover.
            // Por isso o card guarda a origem em variáveis de estado no dragstart.
            const fromId = draggedGameFromId || (e.dataTransfer && e.dataTransfer.getData('text/x-from'));
            if (!fromId || !draggedGameId || draggedListId) return;
            const from = getListById(rootData.Lists, fromId);
            if (!from || from.Id === list.Id || normalizeSortMode(list.SortOrder) !== 'Manual') return;
            e.preventDefault();
            e.stopPropagation();
            clearListDragVisuals();
            item.classList.add('drag-into');
            e.dataTransfer.dropEffect = 'move';
        });

        item.addEventListener('drop', e => {
            const fromId = draggedGameFromId || (e.dataTransfer && e.dataTransfer.getData('text/x-from'));
            const gid = draggedGameId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
            if (!fromId || !gid || draggedListId) return;
            const from = getListById(rootData.Lists, fromId);
            const to = getListById(rootData.Lists, list.Id);
            if (!from || !to || normalizeSortMode(to.SortOrder) !== 'Manual') return;
            e.preventDefault();
            e.stopPropagation();
            moveGameToList(gid, from.Id, to.Id);
            clearListDragVisuals();
            draggedGameId = null;
            draggedGameFromId = null;
        });

        item.addEventListener('dragstart', e => {
            draggedListId = list.Id;
            draggedListNode = list;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/x-list-id', list.Id);
            e.dataTransfer.setData('text/plain', list.Id);
            item.classList.add('dragging');
            // Use a small visual clone instead of the browser's full-page ghost.
            const ghost = item.cloneNode(true);
            ghost.style.cssText = 'position:absolute;top:-1000px;left:-1000px;width:' + item.offsetWidth + 'px;opacity:.65;pointer-events:none;';
            document.body.appendChild(ghost);
            e.dataTransfer.setDragImage(ghost, Math.min(30, item.offsetWidth / 2), 18);
            setTimeout(() => ghost.remove(), 0);
        });

        item.addEventListener('dragover', e => {
            if (!draggedListId || draggedListId === list.Id) return;
            const dragged = getListById(rootData.Lists, draggedListId);
            if (!dragged) return;
            let p = list;
            while (p) {
                if (p.Id === draggedListId) return;
                p = findParent(rootData.Lists, p.Id);
            }
            e.preventDefault();
            e.stopPropagation();
            clearListDragVisuals();
            const mode = listDropMode(item, e.clientY);
            item.classList.add('drag-' + mode);
            e.dataTransfer.dropEffect = 'move';
        });

        item.addEventListener('dragleave', e => {
            if (!item.contains(e.relatedTarget)) item.classList.remove('drag-before', 'drag-after', 'drag-into');
        });

        item.addEventListener('drop', e => {
            e.preventDefault();
            e.stopPropagation();
            if (!draggedListId) return;
            const mode = listDropMode(item, e.clientY);
            const id = draggedListId;
            clearListDragVisuals();
            draggedListId = null;
            draggedListNode = null;
            moveListNode(id, list.Id, mode);
        });

        item.addEventListener('dragend', () => {
            item.classList.remove('dragging');
            clearListDragVisuals();
            draggedListId = null;
            draggedListNode = null;
        });
        container.appendChild(item);

        if (hasChildren) {
            const childWrap = document.createElement('div');
            childWrap.className = 'list-children';
            childWrap.style.display = isExpanded ? 'block' : 'none';
            childWrap.id = `children-${list.Id}`;
            renderListGroup(list.Children, childWrap, false);
            container.appendChild(childWrap);
        }
    }
}

function toggleExpand(id) {
    const list = getListById(rootData.Lists, id);
    if (!list) return;
    list._expanded = list._expanded === false ? true : false;
    const el = document.getElementById(`children-${id}`);
    if (el) {
        el.style.display = list._expanded === false ? 'none' : 'block';
        const chevron = el.previousSibling && el.previousSibling.querySelector('.chevron');
        if (chevron) chevron.classList.toggle('open', list._expanded !== false);
    }
}

// ──────────────────────────────────────────────
// Context menu (right-click on list)
// ──────────────────────────────────────────────
function showCtxMenu(e, list) {
    e.stopPropagation();
    const menu = document.getElementById('ctx-menu');
    menu.innerHTML = '';
    const add = (label, fn, cls = '') => {
        const d = document.createElement('div');
        d.className = 'item ' + cls;
        d.textContent = label;
        d.onclick = (ev) => { ev.stopPropagation(); menu.style.display = 'none'; fn(); };
        menu.appendChild(d);
    };
    add('✏ Renomear / Cor', () => openEditModal(list.Id));
    add('⊞ ' + (list.IsTier ? 'Desativar Tier List' : 'Ativar Tier List'), () => {
        list.IsTier = !list.IsTier;
        markDirty();
        if (currentListId === list.Id) selectList(list.Id);
        else renderSidebar();
    });
    if (!list.Children || !list.Children.length) {
        menu.appendChild(Object.assign(document.createElement('hr'), {}));
        // Move to list options
        const moveMenu = document.createElement('div');
        moveMenu.className = 'item';
        moveMenu.textContent = '↕ Mover para...';
        moveMenu.onclick = (ev) => { ev.stopPropagation(); showMoveMenu(e, list); };
        menu.appendChild(moveMenu);
    }
    menu.appendChild(Object.assign(document.createElement('hr'), {}));
    add('🗑 Excluir', () => deleteListById(list.Id), 'danger');

    menu.style.display = 'block';
    menu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
    menu.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
}

function showMoveMenu(e, list) {
    const menu = document.getElementById('ctx-menu');
    menu.innerHTML = '<div style="padding:6px 12px; font-size:11px; color:var(--dim)">Mover para:</div>';
    // collect all lists
    function collectLists(lists, depth=0) {
        let r = [];
        for (let l of lists) {
            if (l.Id !== list.Id) r.push({l, depth});
            if (l.Children) r = r.concat(collectLists(l.Children, depth+1));
        }
        return r;
    }
    for (let {l, depth} of collectLists(rootData.Lists)) {
        const d = document.createElement('div');
        d.className = 'item';
        d.style.paddingLeft = (12 + depth * 14) + 'px';
        d.textContent = l.Name;
        d.onclick = (ev) => { ev.stopPropagation(); menu.style.display = 'none'; moveListInto(list.Id, l.Id); };
        menu.appendChild(d);
    }
    menu.style.display = 'block';
}

function moveListInto(listId, targetParentId) {
    // Remove from current parent
    function removeFrom(lists) {
        for (let i = 0; i < lists.length; i++) {
            if (lists[i].Id === listId) { return lists.splice(i, 1)[0]; }
            if (lists[i].Children) { let r = removeFrom(lists[i].Children); if (r) return r; }
        }
    }
    const node = removeFrom(rootData.Lists);
    if (!node) return;
    const target = getListById(rootData.Lists, targetParentId);
    if (!target) { rootData.Lists.push(node); }
    else { if (!target.Children) target.Children = []; target.Children.push(node); }
    markDirty();
    renderSidebar();
    if (currentListId) selectList(currentListId);
}

function deleteListById(id) {
    if (!confirm(`Excluir lista "${getListById(rootData.Lists, id)?.Name}"?`)) return;
    function removeFrom(lists) {
        for (let i = 0; i < lists.length; i++) {
            if (lists[i].Id === id) { lists.splice(i, 1); return true; }
            if (lists[i].Children && removeFrom(lists[i].Children)) return true;
        }
    }
    removeFrom(rootData.Lists);
    markDirty();
    if (currentListId === id || !getListById(rootData.Lists, currentListId)) {
        currentListId = null;
        document.getElementById('main-header').style.visibility = 'hidden';
        document.getElementById('content-area').innerHTML = '';
    }
    renderSidebar();
    if (currentListId) selectList(currentListId);
}

function saveEditList() {

// ──────────────────────────────────────────────
// Game card rendering
// ──────────────────────────────────────────────
function generateCard(id) {
    const g = gamesMap[id] || { Name: '?', Platform: '' };
    const initial = (g.Name || '?').charAt(0).toUpperCase();
    let bgStyle;
    if (g.CoverUrl) {
        bgStyle = `style="background-image:url('${g.CoverUrl}'); color:transparent;"`;
    } else {
        let hash = 0; for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
        bgStyle = `style="background:linear-gradient(135deg,hsl(${Math.abs(hash)%360},50%,18%),hsl(${(Math.abs(hash)+50)%360},50%,13%))"`;
    }
    let meta = '';
    if (cfgMeta && g.CriticScore) {
        const cls = g.CriticScore >= 75 ? 'meta-green' : g.CriticScore >= 50 ? 'meta-yellow' : 'meta-red';
        meta = `<div class="metacritic ${cls}">${g.CriticScore}</div>`;
    }
    const src = g.Source || g.Platform || '';

    return `<div class="game-card" data-id="${id}" draggable="true">
        <div class="game-cover" ${bgStyle}>${g.CoverUrl ? '' : esc(initial)}</div>
        ${meta}
        <div class="game-info">
            <div class="game-title" title="${esc(g.Name)}">${esc(g.Name)}</div>
            <div class="game-platform">${esc(src)}</div>
        </div>
    </div>`;
}

function initCardDrag() {
    document.querySelectorAll('.game-card').forEach(c => {
        c.addEventListener('dragstart', e => {
            const holder = c.closest('[data-list-id]');
            draggedGameId = c.dataset.id || null;
            draggedGameFromId = holder ? holder.dataset.listId : currentListId;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/x-from', draggedGameFromId || '');
            e.dataTransfer.setData('text/plain', draggedGameId || '');
            c.classList.add('dragging');
        });
        c.addEventListener('dragend', () => {
            c.classList.remove('dragging');
            draggedGameId = null;
            draggedGameFromId = null;
            clearListDragVisuals();
        });
    });
}


// Todas as linhas da Tier List usam a largura do maior nome.
function updateTierHeaderWidth() {
    const area = document.getElementById('content-area');
    if (!area) return;
    const headers = Array.from(area.querySelectorAll('.tier-header'));
    if (!headers.length) {
        area.style.removeProperty('--tier-header-width');
        return;
    }

    // Mede o texto sem depender da largura atual do próprio header.
    // Isso evita a circularidade do scrollWidth quando o texto está com
    // word-break/break-word e o header já recebeu a largura anterior.
    const canvas = updateTierHeaderWidth._canvas || (updateTierHeaderWidth._canvas = document.createElement('canvas'));
    const ctx = canvas.getContext('2d');
    let max = 90;
    headers.forEach(h => {
        const cs = getComputedStyle(h);
        ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const text = h.textContent.trim();
        const measured = Math.ceil(ctx.measureText(text).width + parseFloat(cs.paddingLeft || 0) + parseFloat(cs.paddingRight || 0) + 2);
        max = Math.max(max, measured);
    });
    area.style.setProperty('--tier-header-width', `${max}px`);
}


window.addEventListener('resize', () => {
    requestAnimationFrame(updateTierHeaderWidth);
});

// ──────────────────────────────────────────────
// Select & render list
// ──────────────────────────────────────────────
function captureTierScrollPositions() {
    const result = {};
    document.querySelectorAll('.tier-games.horizontal-scroll[data-list-id]').forEach(el => {
        result[el.dataset.listId] = el.scrollLeft;
    });
    return result;
}

function restoreTierScrollPositions(positions) {
    if (!positions) return;
    requestAnimationFrame(() => {
        document.querySelectorAll('.tier-games.horizontal-scroll[data-list-id]').forEach(el => {
            const v = positions[el.dataset.listId];
            if (v !== undefined) el.scrollLeft = v;
        });
    });
}

function selectList(id, preserveSearch = false) {
    const tierScrollPositions = captureTierScrollPositions();
    const list = getListById(rootData.Lists, id);
    if (!list) return;
    if (!preserveSearch && currentListId !== id) currentSearch = '';
    currentListId = id;
    const searchBox = document.getElementById('current-search');
    if (searchBox) searchBox.value = currentSearch;
    renderSidebar();

    document.getElementById('main-header').style.visibility = 'visible';
    document.getElementById('header-title').textContent = list.Name;
    document.getElementById('header-color').style.background = list.HexColor || '#8B7CFF';
    document.getElementById('header-count').textContent = `${countGames(list)} jogos`;
    const sortSelect = document.getElementById('sort-select');
    if (sortSelect) sortSelect.value = normalizeSortMode(list.SortOrder);

    // Tier toggle — show only if has children
    const tierBtn = document.getElementById('btn-tier-toggle');
    const parent = findParent(rootData.Lists, id);
    const hasChildren = list.Children && list.Children.length > 0;

    // Only root-level lists (no parent) can be Tier Lists
    if (!parent && hasChildren) {
        tierBtn.style.display = 'inline-block';
        tierBtn.classList.toggle('active', !!list.IsTier);
        tierBtn.textContent = list.IsTier ? '⊞ Tier List (ON)' : '⊞ Tier List (OFF)';
    } else {
        tierBtn.style.display = 'none';
    }

    sortables.forEach(s => s.destroy());
    sortables = [];
    const area = document.getElementById('content-area');
    area.innerHTML = '';

    // Decide view: Tier if root + IsTier + has children; otherwise normal grid
    const isTier = !parent && list.IsTier && hasChildren;

    if (isTier) {
        const tierSortMode = normalizeSortMode(list.SortOrder);
        list.Children.forEach(child => {
            const row = document.createElement('div');
            row.className = 'tier-row';
            const gamesClass = cfgTierLayout === 'HorizontalScroll' ? 'tier-games horizontal-scroll' : 'tier-games';
            row.innerHTML = `<div class="tier-header" style="background:${child.HexColor || '#444'};color:${isDark(child.HexColor) ? '#fff' : '#111'}">${esc(child.Name)}</div>
                             <div class="${gamesClass}" data-list-id="${child.Id}">${getSortedGameIds(child, tierSortMode).map(generateCard).join('')}</div>`;
            area.appendChild(row);
            const sg = new Sortable(row.querySelector('.tier-games'), {
                group: { name: 'tier', pull: true, put: tierSortMode === 'Manual' },
                animation: 130, ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', dragClass: 'sortable-drag',
                disabled: tierSortMode !== 'Manual',
                setData: (dt, el) => dt.setData('text/plain', el.dataset.id),
                onEnd: evt => {
                    if (evt.from === evt.to && evt.oldIndex === evt.newIndex) return;
                    const gid = evt.item.dataset.id;
                    const fromId = evt.from.dataset.listId;
                    const toId = evt.to.dataset.listId;
                    const from = getListById(rootData.Lists, fromId);
                    const to   = getListById(rootData.Lists, toId);
                    if (!from || !to) return;

                    // Usa os IDs reais em vez de oldIndex/newIndex, porque a pesquisa pode
                    // ter escondido cards e, nesse caso, o índice visual não é o índice persistido.
                    const oldIndex = from.GameIds.indexOf(gid);
                    if (oldIndex >= 0) from.GameIds.splice(oldIndex, 1);
                    if (!to.GameIds) to.GameIds = [];

                    const nextEl = evt.to.children[evt.newIndex + 1];
                    const nextId = nextEl ? nextEl.dataset.id : null;
                    let insertIndex = nextId ? to.GameIds.indexOf(nextId) : to.GameIds.length;
                    if (insertIndex < 0) insertIndex = to.GameIds.length;
                    to.GameIds.splice(insertIndex, 0, gid);
                    markDirty();
                    renderSidebar();
                    document.getElementById('header-count').textContent = `${countGames(getListById(rootData.Lists, currentListId))} jogos`;
                    selectList(currentListId, true);
                }
            });
            sortables.push(sg);
        });

        // Jogos que pertencem diretamente à lista-mãe aparecem como uma tier especial
        // de pendentes, sempre por último, e podem ser arrastados para qualquer sublista.
        if ((list.GameIds || []).length) {
            const row = document.createElement('div');
            row.className = 'tier-row pending-tier';
            const gamesClass = cfgTierLayout === 'HorizontalScroll' ? 'tier-games horizontal-scroll' : 'tier-games';
            row.innerHTML = `<div class="tier-header">Pendentes</div>
                             <div class="${gamesClass}" data-list-id="${list.Id}">${getSortedGameIds(list, tierSortMode).map(generateCard).join('')}</div>`;
            area.appendChild(row);
            const sg = new Sortable(row.querySelector('.tier-games'), {
                group: { name: 'tier', pull: true, put: tierSortMode === 'Manual' },
                animation: 130, ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', dragClass: 'sortable-drag',
                disabled: tierSortMode !== 'Manual',
                setData: (dt, el) => dt.setData('text/plain', el.dataset.id),
                onEnd: evt => {
                    if (evt.from === evt.to && evt.oldIndex === evt.newIndex) return;
                    const gid = evt.item.dataset.id;
                    const fromId = evt.from.dataset.listId;
                    const toId = evt.to.dataset.listId;
                    const from = getListById(rootData.Lists, fromId);
                    const to = getListById(rootData.Lists, toId);
                    if (!from || !to) return;
                    const oldIndex = (from.GameIds || []).indexOf(gid);
                    if (oldIndex >= 0) from.GameIds.splice(oldIndex, 1);
                    if (!to.GameIds) to.GameIds = [];
                    const nextEl = evt.to.children[evt.newIndex + 1];
                    const nextId = nextEl ? nextEl.dataset.id : null;
                    let insertIndex = nextId ? to.GameIds.indexOf(nextId) : to.GameIds.length;
                    if (insertIndex < 0) insertIndex = to.GameIds.length;
                    to.GameIds.splice(insertIndex, 0, gid);
                    markDirty();
                    renderSidebar();
                    document.getElementById('header-count').textContent = `${countGames(getListById(rootData.Lists, currentListId))} jogos`;
                    selectList(currentListId, true);
                }
            });
            sortables.push(sg);
        }
    } else {
        // Normal grid — collect all GameIds (own + children) if it's a parent list
        let ids = list.GameIds || [];
        const grid = document.createElement('div');
        grid.className = 'games-grid';
        grid.dataset.listId = list.Id;
        ids = getSortedGameIds(list);
        grid.innerHTML = ids.map(generateCard).join('');
        area.appendChild(grid);
        const sg = new Sortable(grid, {
            animation: 130, ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', dragClass: 'sortable-drag',
            disabled: normalizeSortMode(list.SortOrder) !== 'Manual',
            setData: (dt, el) => dt.setData('text/plain', el.dataset.id),
            onEnd: evt => {
                if (evt.oldIndex === evt.newIndex) return;
                const gid = evt.item.dataset.id;
                const oldIndex = list.GameIds.indexOf(gid);
                if (oldIndex >= 0) list.GameIds.splice(oldIndex, 1);
                const nextEl = evt.to.children[evt.newIndex + 1];
                const nextId = nextEl ? nextEl.dataset.id : null;
                let insertIndex = nextId ? list.GameIds.indexOf(nextId) : list.GameIds.length;
                if (insertIndex < 0) insertIndex = list.GameIds.length;
                list.GameIds.splice(insertIndex, 0, gid);
                markDirty();
            }
        });
        sortables.push(sg);
    }
    initCardDrag();
    requestAnimationFrame(() => {
        updateTierHeaderWidth();
        restoreTierScrollPositions(tierScrollPositions);
    });
}

function isDark(hex) {
    if (!hex) return true;
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) < 140;
}

function toggleTierList() {
    const list = getListById(rootData.Lists, currentListId);
    if (!list) return;
    list.IsTier = !list.IsTier;
    markDirty();
    selectList(currentListId);
}

function moveGameToList(gid, fromId, toId) {
    const from = getListById(rootData.Lists, fromId);
    const to   = getListById(rootData.Lists, toId);
    if (!from || !to) return;
    if (from.GameIds) from.GameIds = from.GameIds.filter(x => x !== gid);
    if (!to.GameIds) to.GameIds = [];
    to.GameIds.push(gid);
    markDirty();
    selectList(currentListId);
    requestAnimationFrame(updateTierHeaderWidth);
}

// Touch navigation / drag
// ──────────────────────────────────────────────
// O gesto touch segue o comportamento de Android/iOS: tocar e mover = scroll;
// segurar sem mover por um tempo = inicia o rearranjo. O timer é global para não
// desaparecer quando o dedo sai do card durante um scroll.
let touchDrag = null;
let touchSuppressClickUntil = 0;
let touchInitialized = false;
let touchPending = null;

function touchPoint(e) { return { x: e.clientX, y: e.clientY }; }
function isTouchMode() { return cfgInputMode === 'touch'; }

function clearTouchDropIndicator() {
    const line = document.getElementById('touch-drop-line');
    if (line) line.style.display = 'none';
}

function ensureTouchOverlay() {
    if (!document.getElementById('touch-drop-line')) {
        const line = document.createElement('div');
        line.id = 'touch-drop-line';
        line.className = 'touch-drop-line';
        document.body.appendChild(line);
    }
}

function showTouchDropLine(rect, after = false) {
    ensureTouchOverlay();
    const line = document.getElementById('touch-drop-line');
    line.style.display = 'block';
    line.style.left = Math.max(0, rect.left - 2) + 'px';
    line.style.width = Math.max(8, rect.width + 4) + 'px';
    line.style.top = (after ? rect.bottom - 2 : rect.top - 2) + 'px';
}

function createTouchGhost(source) {
    const ghost = source.cloneNode(true);
    ghost.classList.add('touch-drag-ghost');
    const r = source.getBoundingClientRect();
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    document.body.appendChild(ghost);
    return ghost;
}

function startTouchGameDrag(card, p, pointerId) {
    const holder = card.closest('[data-list-id]');
    if (!holder) return false;
    const sourceId = holder.dataset.listId;
    const source = getListById(rootData.Lists, sourceId);
    if (!source || normalizeSortMode(source.SortOrder) !== 'Manual') return false;
    touchDrag = { type:'game', id:card.dataset.id, sourceId, pointerId,
        startX:p.x, startY:p.y, ghost:createTouchGhost(card), targetId:null,
        sourceTargetListId:sourceId, after:false };
    document.body.classList.add('touch-dragging');
    card.classList.add('touch-source-hidden');
    touchDrag.ghost.style.left = p.x + 'px';
    touchDrag.ghost.style.top = p.y + 'px';
    try { card.setPointerCapture(pointerId); } catch (_) {}
    return true;
}

function startTouchListDrag(item, list, p, pointerId) {
    touchDrag = { type:'list', id:list.Id, pointerId, startX:p.x, startY:p.y,
        ghost:createTouchGhost(item), targetId:null, position:null };
    document.body.classList.add('touch-dragging');
    item.classList.add('touch-source-hidden');
    touchDrag.ghost.style.left = p.x + 'px';
    touchDrag.ghost.style.top = p.y + 'px';
    try { item.setPointerCapture(pointerId); } catch (_) {}
    return true;
}

function autoScrollTouchTier(p) {
    const el = document.elementFromPoint(p.x, p.y);
    const tier = el && el.closest ? el.closest('.tier-games.horizontal-scroll') : null;
    if (!tier) return;
    const r = tier.getBoundingClientRect();
    const edge = Math.min(90, Math.max(45, r.width * .16));
    if (p.x > r.right - edge) {
        tier.scrollLeft += Math.max(8, Math.round((p.x - (r.right-edge)) * .45));
    } else if (p.x < r.left + edge) {
        tier.scrollLeft -= Math.max(8, Math.round(((r.left+edge)-p.x) * .45));
    }
}

function updateTouchGameTarget(p) {
    clearTouchDropIndicator();
    document.querySelectorAll('.list-item.drag-over').forEach(x => x.classList.remove('drag-over'));
    autoScrollTouchTier(p);
    const el = document.elementFromPoint(p.x, p.y);
    const card = el && el.closest ? el.closest('.game-card') : null;
    const sidebarItem = el && el.closest ? el.closest('.list-item') : null;
    const holder = el && el.closest ? el.closest('[data-list-id]') : null;
    const targetListId = holder ? holder.dataset.listId : (sidebarItem ? findListIdFromSidebarItem(sidebarItem) : null);
    if (!targetListId) return;
    const targetList = getListById(rootData.Lists, targetListId);
    if (!targetList || normalizeSortMode(targetList.SortOrder) !== 'Manual') return;

    if (sidebarItem) {
        touchDrag.targetId = null;
        touchDrag.sourceTargetListId = targetListId;
        touchDrag.after = false;
        sidebarItem.classList.add('drag-over');
        return;
    }

    if (card && card.dataset.id !== touchDrag.id) {
        const r = card.getBoundingClientRect();
        // Em layout horizontal, a linha vertical faz mais sentido; mantemos a
        // indicação visual simples e deixamos o scroll do container posicionar o card.
        const horizontal = !!card.closest('.horizontal-scroll');
        const after = horizontal ? p.x > r.left + r.width / 2 : p.y > r.top + r.height / 2;
        touchDrag.targetId = card.dataset.id;
        touchDrag.sourceTargetListId = holder.dataset.listId;
        touchDrag.after = after;
        if (horizontal) {
            ensureTouchOverlay();
            const line = document.getElementById('touch-drop-line');
            line.style.display = 'block';
            line.style.top = Math.max(0, r.top - 2) + 'px';
            line.style.height = Math.max(8, r.height + 4) + 'px';
            line.style.width = '3px';
            line.style.left = (after ? r.right - 2 : r.left - 2) + 'px';
        } else showTouchDropLine(r, after);
    } else if (holder) {
        touchDrag.targetId = null;
        touchDrag.sourceTargetListId = holder.dataset.listId;
        touchDrag.after = false;
        const r = holder.getBoundingClientRect();
        showTouchDropLine({left:r.left+6,width:Math.max(8,r.width-12),top:r.top+6,bottom:r.top+6,height:0}, false);
    }
}

function updateTouchListTarget(p) {
    clearTouchDropIndicator();
    const el = document.elementFromPoint(p.x, p.y);
    const item = el && el.closest ? el.closest('.list-item') : null;
    if (!item) return;
    const targetId = findListIdFromSidebarItem(item);
    if (!targetId || targetId === touchDrag.id || isDescendantList(targetId, touchDrag.id)) return;
    const target = getListById(rootData.Lists, targetId);
    if (!target) return;
    const r = item.getBoundingClientRect();
    const ratio = (p.y-r.top)/Math.max(1,r.height);
    const position = ratio < .25 ? 'before' : ratio > .75 ? 'after' : 'inside';
    touchDrag.targetId = targetId;
    touchDrag.position = position;
    if (position === 'inside') item.classList.add('drag-over');
    else showTouchDropLine(r, position === 'after');
}

function findListIdFromSidebarItem(item) { return item?.dataset?.listId || null; }
function isDescendantList(id, possibleAncestorId) {
    const ancestor=getListById(rootData.Lists,possibleAncestorId); if(!ancestor) return false;
    let found=false;
    (function walk(ls){(ls||[]).forEach(l=>{if(l.Id===id)found=true;walk(l.Children);});})(ancestor.Children);
    return found;
}
function removeListNode(id) {
    function remove(ls){for(let i=0;i<ls.length;i++){if(ls[i].Id===id)return ls.splice(i,1)[0];if(ls[i].Children){const n=remove(ls[i].Children);if(n)return n;}}return null;}
    return remove(rootData.Lists);
}
function commitTouchListDrag() {
    const d=touchDrag; if(!d||!d.targetId||!d.position)return;
    const node=removeListNode(d.id); if(!node)return;
    const target=getListById(rootData.Lists,d.targetId); if(!target){rootData.Lists.push(node);return;}
    if(d.position==='inside'){target.Children=target.Children||[];target.Children.push(node);}
    else {const parent=findParent(rootData.Lists,target.Id);const siblings=parent?(parent.Children||(parent.Children=[])):rootData.Lists;const idx=siblings.findIndex(x=>x.Id===target.Id);siblings.splice(Math.max(0,idx+(d.position==='after'?1:0)),0,node);}
    markDirty(); renderSidebar(); if(currentListId)selectList(currentListId,true);
}
function commitTouchGameDrag() {
    const d=touchDrag; if(!d||!d.sourceTargetListId)return;
    const scrollPositions=captureTierScrollPositions();
    const from=getListById(rootData.Lists,d.sourceId), to=getListById(rootData.Lists,d.sourceTargetListId);
    if(!from||!to||normalizeSortMode(to.SortOrder)!=='Manual')return;
    const oldIndex=(from.GameIds||[]).indexOf(d.id); if(oldIndex>=0)from.GameIds.splice(oldIndex,1);
    to.GameIds=to.GameIds||[];
    let insertIndex=to.GameIds.length;
    if(d.targetId){const ti=to.GameIds.indexOf(d.targetId);if(ti>=0)insertIndex=ti+(d.after?1:0);}
    to.GameIds.splice(insertIndex,0,d.id);
    markDirty(); renderSidebar(); if(currentListId)selectList(currentListId,true);
    restoreTierScrollPositions(scrollPositions);
}
function finishTouchDrag(commit) {
    if(!touchDrag)return;
    if(commit){if(touchDrag.type==='game')commitTouchGameDrag();else commitTouchListDrag();}
    if(touchDrag.ghost)touchDrag.ghost.remove();
    document.querySelectorAll('.touch-source-hidden').forEach(x=>x.classList.remove('touch-source-hidden'));
    document.querySelectorAll('.list-item.drag-over').forEach(x=>x.classList.remove('drag-over'));
    clearTouchDropIndicator(); document.body.classList.remove('touch-dragging');
    touchSuppressClickUntil=Date.now()+450; touchDrag=null;
}

function installTouchNavigation() {
    if(touchInitialized)return; touchInitialized=true; ensureTouchOverlay();
    document.addEventListener('pointerdown',e=>{
        if(!isTouchMode()||e.pointerType!=='touch')return;
        if(e.target.closest('#setup-modal,#edit-modal,input,select,button,textarea'))return;
        const card=e.target.closest('.game-card'), item=e.target.closest('.list-item');
        if(!card&&!item)return;
        if(touchPending){clearTimeout(touchPending.timer);touchPending=null;}
        const p=touchPoint(e), source=card||item, list=item?getListById(rootData.Lists,findListIdFromSidebarItem(item)):null;
        touchPending={type:card?'game':'list',pointerId:e.pointerId,source,startX:p.x,startY:p.y,
            timer:setTimeout(()=>{
                if(!touchPending||touchPending.pointerId!==e.pointerId)return;
                const pending=touchPending; touchPending=null;
                if(pending.type==='game')startTouchGameDrag(pending.source,{x:pending.startX,y:pending.startY},e.pointerId);
                else if(list)startTouchListDrag(pending.source,list,{x:pending.startX,y:pending.startY},e.pointerId);
            }, 550)};
    },{passive:true});

    document.addEventListener('pointermove',e=>{
        if(!isTouchMode()||e.pointerType!=='touch')return;
        if(!touchDrag){
            if(touchPending&&touchPending.pointerId===e.pointerId){
                const dx=e.clientX-touchPending.startX,dy=e.clientY-touchPending.startY;
                // Qualquer movimento perceptível antes do long-press cancela o drag.
                // O browser fica livre para executar o scroll nativo.
                if(Math.hypot(dx,dy)>10){clearTimeout(touchPending.timer);touchPending=null;}
            }
            return;
        }
        if(touchDrag.pointerId!==e.pointerId)return;
        e.preventDefault();
        touchDrag.ghost.style.left=e.clientX+'px';touchDrag.ghost.style.top=e.clientY+'px';
        const p={x:e.clientX,y:e.clientY};
        if(touchDrag.type==='game')updateTouchGameTarget(p);else updateTouchListTarget(p);
    },{passive:false});

    document.addEventListener('pointerup',e=>{
        if(!isTouchMode()||e.pointerType!=='touch')return;
        if(touchDrag&&touchDrag.pointerId===e.pointerId){e.preventDefault();finishTouchDrag(true);return;}
        if(touchPending&&touchPending.pointerId===e.pointerId){clearTimeout(touchPending.timer);touchPending=null;}
    },{passive:false});
    document.addEventListener('pointercancel',e=>{
        if(!isTouchMode()||e.pointerType!=='touch')return;
        if(touchDrag&&touchDrag.pointerId===e.pointerId)finishTouchDrag(false);
        if(touchPending&&touchPending.pointerId===e.pointerId){clearTimeout(touchPending.timer);touchPending=null;}
    });
    document.addEventListener('click',e=>{if(isTouchMode()&&Date.now()<touchSuppressClickUntil){e.preventDefault();e.stopPropagation();}},true);
}
installTouchNavigation();

// Save to Supabase
// ──────────────────────────────────────────────
// manual = true quando vem do botão "Salvar" (mostra erro); o autosave tenta de novo em silêncio.
async function syncToSupabase(manual = true) {
    clearTimeout(saveTimer);
    if (saving) { resaveAfter = true; return; }
    saving = true;
    const ind = document.getElementById('loading-indicator');
    ind.style.display = 'block';
    ind.textContent = 'Salvando...';
    let ok = false;
    try {
        if (!rootData.UpdatedAt) rootData.UpdatedAt = Date.now();
        const stamp = rootData.UpdatedAt;
        // Campos internos de interface (_expanded) não vão para a nuvem.
        const payload = JSON.parse(JSON.stringify(rootData, (k, v) => (k.startsWith('_') ? undefined : v)));
        let cleanUrl = url.replace(/\/$/, '');
        const res = await fetch(`${cleanUrl}/rest/v1/playnite_lists?on_conflict=id`, {
            method: 'POST',
            headers: { 'apikey': key, 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ id: 'my_playnite_lists', lists_json: payload })
        });
        if (!res.ok) throw new Error('POST failed');
        ok = true;
        // Só considera salvo se não houve nova edição durante o envio.
        if (rootData.UpdatedAt === stamp) dirty = false;
    } catch (e) {
        console.error(e);
        if (manual) alert('Erro ao salvar no Supabase.');
        else { clearTimeout(saveTimer); saveTimer = setTimeout(() => syncToSupabase(false), 5000); } // tenta de novo
    }
    saving = false;
    setTimeout(() => { if (!saving) ind.style.display = 'none'; ind.textContent = 'Sincronizando...'; }, ok ? 800 : 0);
    if (resaveAfter) { resaveAfter = false; if (dirty) syncToSupabase(false); }
}
