<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Listas - Playnite Web</title>
    <link id="font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .timeline { --year-accent:#66c7ed; padding:12px 0 24px; }
        .timeline-intro { margin:0 0 28px; padding:22px 26px; border:1px solid #324653; border-radius:14px; background:linear-gradient(120deg,#213749,#14202e); }
        .timeline-intro strong { display:block; font-size:24px; letter-spacing:-.5px; margin-bottom:6px; }
        .timeline-intro p { margin:0; color:#a6bed0; font-size:13px; }
        .timeline-track { padding-left:32px; }
        .timeline-year { position:relative; padding:0 0 28px 24px; border-left:2px solid #3b5262; }
        .timeline-year::before { content:''; position:absolute; width:12px; height:12px; top:24px; left:-8px; border:2px solid #152431; border-radius:50%; background:var(--year-accent); box-shadow:0 0 0 5px #274353; }
        .timeline-panel { border:1px solid #314452; border-top:3px solid var(--year-accent); border-radius:12px; background:linear-gradient(135deg,#1a2b38,#151e2c); overflow:hidden; }
        .timeline-year-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px; }
        .timeline-year-heading h3 { color:var(--year-accent); font-size:30px; line-height:1.1; margin:0; font-weight:800; }
        .timeline-year-heading small { display:block; color:#9fb5c7; margin-top:6px; }
        .timeline-year .tier-games { padding:12px 20px 20px; gap:12px; }
        .timeline-year .tier-games:empty::after { content:'Arraste jogos para este ano'; }
        .timeline-pending .tier-games:empty::after { content:'Todos os jogos já estão organizados'; }
        .timeline-pending { --year-accent:#8d9bad !important; }
        .timeline-pending .timeline-year-heading h3 { font-size:22px; }
        .timeline-horizontal { overflow-x:auto; padding-bottom:16px; overscroll-behavior-x:contain; }
        .timeline-scroll-nav { display:flex; justify-content:flex-end; gap:8px; margin:0 0 18px; }
        .timeline-horizontal .timeline-track { display:flex; align-items:flex-start; padding:16px 0 0; min-width:max-content; }
        .timeline-horizontal .timeline-year { flex:0 0 clamp(340px,48vw,620px); width:clamp(340px,48vw,620px); border-left:0; border-top:2px solid #3b5262; padding:26px 18px 0 0; }
        .timeline-horizontal .timeline-year::before { top:-8px; left:22px; }
        @media(max-width:600px) { .timeline-track { padding-left:10px; } .timeline-year { padding-left:16px; } .timeline-year-heading { padding:14px; } .timeline-year-heading h3 { font-size:25px; } }
        #game-remove-zone { display:none; position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:10000; padding:18px 36px; border:2px dashed #F2606A; border-radius:14px; background:#351e29; color:#fff; pointer-events:auto; }
        body.click-move-active #game-remove-zone { display:block; }
        body.automatic-game-drag #game-remove-zone { display:none; }
        #game-remove-zone.active { background:#a42e44; border-style:solid; }
        :root {
            --bg: #0F111A;
            --panel: #161925;
            --card: #1F2332;
            --card-hover: #2A2F42;
            --text: #EEF0F7;
            --dim: #8A91A8;
            --accent: #8B7CFF;
            --accent-soft: rgba(139, 124, 255, 0.2);
            --border: #2A2F42;
            --font-family: 'Inter', sans-serif;
            --card-width: 140px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scrollbar-gutter: stable; }
        body { font-family: var(--font-family); background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--card-hover); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(10px); }
        .modal-content { background: var(--panel); border-radius: 12px; padding: 24px; width: 460px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 20px; font-weight: 600; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { cursor: pointer; color: var(--dim); font-size: 20px; background: none; border: none; color: var(--dim); }
        .close-btn:hover { color: var(--text); }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
        .input-group input[type="text"], .input-group select { width: 100%; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: inherit; outline: none; font-size: 13px; }
        .input-group input[type="text"]:focus { border-color: var(--accent); }
        .toggle-group { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; }
        .toggle-group input { margin-right: 10px; cursor: pointer; width: 15px; height: 15px; accent-color: var(--accent); }
        .toggle-group label { font-size: 13px; cursor: pointer; }
        .section-title { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 12px; }
        .modal-section { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .modal-section:last-child { border-bottom: none; margin-bottom: 0; }
        .btn { background: var(--accent); color: #10121A; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; width: 100%; font-family: inherit; font-size: 14px; }
        .btn:hover { opacity: 0.9; }
        .btn-sm { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 12px; }
        .btn-sm:hover { background: var(--card-hover); }
        .btn-danger { background: rgba(220,50,50,0.2); color: #ff6b6b; border: 1px solid rgba(220,50,50,0.3); }
        .btn-danger:hover { background: rgba(220,50,50,0.35); }

        /* Sidebar */
        .sidebar { width: 310px; background: var(--panel); display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: width 0.18s ease; overflow: hidden; flex-shrink: 0; }
        .sidebar.collapsed { width: 48px; }
        .sidebar.collapsed .sidebar-title, .sidebar.collapsed .lists-container { display: none; }
        .sidebar.collapsed .sidebar-header { padding: 8px 6px; justify-content: center; }
        .sidebar.collapsed .sidebar-actions { width: 100%; justify-content: center; }
        .sidebar.collapsed .sidebar-settings { display: none; }
        .sidebar.collapsed .new-list-button { display:none; }
        .sidebar-list-actions { display:flex; flex-direction:column; gap:8px; padding:12px; }
        .sidebar.collapsed .sidebar-list-actions { display:none; }
        .sidebar-toggle { flex-shrink: 0; width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
        .sidebar-header { padding: 18px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { font-size: 16px; font-weight: 700; }
        .lists-container { flex: 1; overflow-y: auto; padding: 8px 8px; }

        .list-group { }
        .list-item {
            padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center;
            margin-bottom: 1px; border: 1px solid transparent; user-select: none;
        }
        .list-item:hover { background: var(--card); }
        .list-item.active { background: var(--card); border-color: var(--border); }
        .list-item.drag-over { background: var(--accent-soft) !important; border-color: var(--accent) !important; }
        .list-item .chevron { width: 16px; font-size: 10px; color: var(--dim); flex-shrink: 0; transition: transform 0.15s; cursor: pointer; text-align: center; }
        .list-item .chevron.open { transform: rotate(90deg); }
        .list-item .chevron.empty { visibility: hidden; }
        .list-color { width: 9px; height: 9px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }
        .list-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
        .list-count { font-size: 10px; color: var(--dim); background: var(--bg); padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
        .list-children { overflow: hidden; margin-left: 18px; padding-left: 4px; border-left: 1px solid var(--border); }
        .list-ctx-menu { position: fixed; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.4); min-width: 180px; }
        .list-ctx-menu .item { padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .list-ctx-menu .item:hover { background: var(--card-hover); }
        .list-ctx-menu .item.danger { color: #ff6b6b; }
        .list-ctx-menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

        /* Color palette */
        .color-palette { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .color-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; }
        .color-dot:hover { transform: scale(1.2); }
        .color-dot.selected { border-color: white; }

        /* Main */
        .main-content { flex: 1 1 0%; width: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
        .main-header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap:wrap; gap:16px; flex-shrink: 0; min-width: 0; }
        .main-header-left { display: flex; align-items: center; }
        .main-header h2 { font-size: 22px; font-weight: 700; }
        .header-subtitle { color: var(--dim); font-size: 12px; margin-top: 3px; }
        .header-color { width: 5px; height: 36px; border-radius: 3px; margin-right: 14px; flex-shrink: 0; }
        .actions { display: flex; flex:1 1 640px; gap: 10px; align-items: center; justify-content:flex-end; flex-wrap:wrap; min-width: 0; max-width:100%; }
        .actions > * { flex-shrink:0; }
        .current-search { width: 190px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; font-family: inherit; font-size: 12px; }
        .current-search:focus { border-color: var(--accent); }
        .sort-select, .interaction-select { padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; font-family: inherit; font-size: 12px; }
        .interaction-select { min-width: 118px; }
        .sortable-ghost { opacity: 0.32 !important; }
        .sortable-chosen { box-shadow: 0 0 0 2px var(--accent-soft); }
        /* Modos de interação */
        body.view-only .game-card { cursor: default; }
        body.view-only .sortable-chosen, body.view-only .sortable-ghost { box-shadow: none !important; }
        body.click-move-active { cursor: grabbing; user-select: none; }
        .game-card.click-move-ghost { position: fixed; z-index: 3000; pointer-events: none; opacity: .82; transform: translate(-50%, -50%) scale(.96); box-shadow: 0 16px 36px rgba(0,0,0,.45); border-radius: 8px; }
        .click-move-source { opacity: 1 !important; outline: 3px solid var(--accent) !important; outline-offset: 3px; box-shadow: 0 0 0 5px rgba(139,124,255,.18), 0 10px 28px rgba(0,0,0,.45) !important; transform: translateY(-3px) scale(1.025); z-index: 10; }
        .list-item.click-move-target { outline: 2px solid var(--accent) !important; outline-offset: -2px; }
        .game-card.move-source-hidden { display: none; }
        .card-drop-slot { flex: 0 0 auto; border: 2px dashed rgba(139,124,255,.5); background: rgba(139,124,255,.08); border-radius: 8px; pointer-events: auto; }
        .click-move-line { position: fixed; z-index: 2999; pointer-events: none; background: var(--accent); border-radius: 3px; box-shadow: 0 0 8px rgba(139,124,255,.55); display: none; }

        .zoom-slider { width: 90px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; }
        .btn-outline:hover { background: var(--card); }
        .btn-outline.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
        .content-area { flex: 1 1 0%; align-self: stretch; min-height: 0; overflow-y: scroll; padding: 24px 28px; min-width: 0; scrollbar-gutter: stable; overflow-anchor: none; }

        /* Grid */
        .games-grid { display: flex; flex-wrap: wrap; gap: 16px; align-content: flex-start; }

        /* Tier rows */
        .tier-row { margin-bottom: 16px; background: var(--panel); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: flex; }
        .tier-header { width: var(--tier-header-width, 40px); flex: 0 0 var(--tier-header-width, 40px); display: flex; align-items: center; justify-content: center; padding: clamp(4px, calc(var(--card-width) * 0.08), 12px); font-weight: 700; font-size: clamp(10px, calc(var(--card-width) * 0.11), 15px); text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.4); word-break: break-word; }
        .tier-games { flex: 1; padding: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; min-height: calc(var(--card-width) * 1.4 + 18px); min-width: 0; position: relative; }
        .tier-games:empty::after { content: 'Sem jogos'; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 12px; pointer-events: none; }
        .tier-games.horizontal-scroll { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
        .tier-row.pending-tier .tier-header { background: #555B6E !important; color: #fff !important; }

        /* Game Card */
        .game-card { background: var(--card); border-radius: 8px; overflow: hidden; width: var(--card-width); flex-shrink: 0; border: 1px solid transparent; cursor: grab; position: relative; touch-action: pan-x pan-y pinch-zoom; transition: transform 0.15s, box-shadow 0.15s; }
        body.drag-mode #content-area .game-card { touch-action: none; }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.35); border-color: var(--border); }
        .game-cover { height: calc(var(--card-width) * 1.4); background: #2D3243; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.15); background-size: cover; background-position: center; }
        .metacritic { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; background: rgba(0,0,0,0.75); color: white; border: 2px solid; }
        .meta-green { border-color: #6c3; }
        .meta-yellow { border-color: #fc3; }
        .meta-red { border-color: #f55; }
        .game-info { padding: 9px 10px 10px; }
        .game-title { font-weight: 600; font-size: 12px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        body.wrap-game-names .game-title { white-space: normal; overflow-wrap: anywhere; text-overflow: clip; }
        .game-platform { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .list-item { position: relative; }
        .list-item.dragging { opacity: .35; }
        .list-item.drag-before::before, .list-item.drag-after::after { content: ''; position: absolute; left: 6px; right: 6px; height: 3px; background: var(--accent); border-radius: 3px; pointer-events: none; }
        .list-item.drag-before::before { top: -2px; }
        .list-item.drag-after::after { bottom: -2px; }
        .list-item.drag-into { outline: 2px solid var(--accent); outline-offset: -2px; background: rgba(139,124,255,.12); }

        .loading { display: none; position: fixed; bottom: 20px; right: 20px; max-width: calc(100vw - 40px); background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 12px; font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,.3); z-index: 2000; }
        button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    </style>
</head>
<body>
<div class="loading" id="loading-indicator">Sincronizando...</div>

<!-- Settings Modal -->
<div class="modal" id="setup-modal">
    <div class="modal-content">
        <h2>Configurações <button class="close-btn" id="close-setup" style="display:none" onclick="document.getElementById('setup-modal').style.display='none'">✕</button></h2>

        <div class="modal-section">
            <div class="section-title">Supabase</div>
            <div class="input-group"><label>URL do Projeto</label><input type="text" id="supa-url" placeholder="https://xyz.supabase.co"></div>
            <div class="input-group"><label>API Key (anon)</label><input type="text" id="supa-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></div>
        </div>

        <div class="modal-section">
            <div class="section-title">Interface</div>
            <div class="toggle-group"><input type="checkbox" id="cfg-meta"><label for="cfg-meta">Mostrar nota Metacritic nas capas</label></div>
            <div class="toggle-group"><input type="checkbox" id="cfg-game-names"><label for="cfg-game-names">Mostrar nomes dos jogos</label></div>
            <div class="toggle-group"><input type="checkbox" id="cfg-wrap-game-names"><label for="cfg-wrap-game-names">Quebrar linha nos nomes dos jogos</label></div>
            <div class="toggle-group"><input type="checkbox" id="cfg-game-source"><label for="cfg-game-source">Mostrar biblioteca/origem</label></div>
            <div class="input-group"><label>Layout dos jogos nas tiers</label><select id="cfg-tier-layout" onchange="changeTierLayout(this.value)"><option value="Wrap">Quebrar linha</option><option value="HorizontalScroll">Scroll horizontal</option></select></div>
            <div class="input-group"><label>Fonte da Interface</label><input type="text" id="cfg-font" placeholder="Inter"></div>
        </div>

        <button class="btn" onclick="saveSetup()">Aplicar configurações</button>
    </div>
</div>

<div id="game-remove-zone">✕ Remover desta lista</div>
<!-- Edit List Modal -->
<div class="modal" id="edit-modal" style="display:none">
    <div class="modal-content">
        <h2><span id="edit-heading">Editar lista</span> <button class="close-btn" onclick="document.getElementById('edit-modal').style.display='none'">✕</button></h2>
        <div class="modal-section">
            <div class="input-group"><label id="edit-name-label">Nome</label><input type="text" id="edit-name"></div>
            <div class="input-group"><label>Visualização padrão</label><select id="edit-view" onchange="updateTimelineEditOptions()"><option value="Grid">Grade</option><option value="Tier">Tierlist</option><option value="Timeline">Linha do tempo</option></select></div>
            <div id="edit-timeline-options">
                <div class="input-group"><label>Ordem dos anos</label><select id="edit-timeline-order"><option value="Ascending">Crescente</option><option value="Descending">Decrescente</option></select></div>
                <div class="input-group"><label>Orientação da linha do tempo</label><select id="edit-timeline-orientation"><option value="Vertical">Vertical</option><option value="Horizontal">Horizontal</option></select></div>
            </div>
            <div class="input-group">
                <label>Cor</label>
                <div class="color-palette" id="edit-colors"></div>
            </div>
        </div>
        <div style="display:flex; gap:8px; margin-top:4px;">
            <button class="btn" onclick="saveEditList()" style="flex:1">Salvar</button>
            <button id="edit-delete" class="btn-sm btn-danger" onclick="deleteList()" style="padding:10px 16px">Excluir</button>
        </div>
    </div>
</div>

<!-- Right-click context menu -->
<div id="ctx-menu" class="list-ctx-menu" style="display:none"></div>

<div class="sidebar">
    <div class="sidebar-header">
        <h1 class="sidebar-title">Minhas Listas</h1>
        <div class="sidebar-actions" style="display:flex;gap:6px;align-items:center">
            <button class="btn-sm sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" title="Recolher barra lateral">◀</button>
            <button class="btn-sm sidebar-settings" onclick="openSetup()">⚙</button>
        </div>
    </div>
    <div class="sidebar-list-actions">
        <button class="btn-outline new-list-button" onclick="openCreateList()">＋ Nova lista</button>
        <button class="btn-outline" id="lists-expand-toggle" onclick="toggleAllLists()" aria-expanded="false">Expandir todas</button>
    </div>
    <div class="lists-container" id="lists-container"></div>
</div>

<div class="main-content">
    <div class="main-header" id="main-header" style="visibility:hidden">
        <div class="main-header-left">
            <div class="header-color" id="header-color"></div>
            <div>
                <h2 id="header-title"></h2>
                <div class="header-subtitle" id="header-count"></div>
            </div>
        </div>
        <div class="actions">
            <input class="current-search" id="current-search" type="text" placeholder="Buscar nesta lista" oninput="changeCurrentSearch(this.value)">
            <select class="sort-select" id="sort-select" onchange="changeSortMode(this.value)" title="Ordenação">
                <option value="Manual">Manual</option>
                <option value="Alphabetical">A-Z</option>
                <option value="Metacritic">Metacritic</option>
            </select>
            <select id="view-select" class="sort-select" onchange="changeListView(this.value)" title="Visualização padrão desta lista"><option value="Grid">Grade</option><option value="Tier">Tierlist</option><option value="Timeline">Linha do tempo</option></select>
            <select id="timeline-order" class="sort-select" title="Ordem dos anos" aria-label="Ordem dos anos" onchange="changeTimelineOption('TimelineOrder',this.value)" style="display:none"><option value="Ascending">Anos ↑ Crescente</option><option value="Descending">Anos ↓ Decrescente</option></select>
            <select id="timeline-orientation" class="sort-select" title="Orientação da linha do tempo" aria-label="Orientação da linha do tempo" onchange="changeTimelineOption('TimelineOrientation',this.value)" style="display:none"><option value="Vertical">Vertical</option><option value="Horizontal">Horizontal</option></select>
            <select class="interaction-select" id="interaction-mode" onchange="changeInteractionMode(this.value)" title="Modo de interação">
                <option value="drag">Arrastar</option>
                <option value="double">Clique duplo</option>
                <option value="view">Visualização</option>
            </select>
            <input type="range" class="zoom-slider" id="zoom-slider" min="40" max="240" value="140" oninput="changeZoom(this.value)" title="Zoom das capas">
        </div>
    </div>
    <div class="content-area" id="content-area"></div>
</div>

<script>
const PALETTE = ['#8B7CFF','#3DCB7F','#F2B84B','#E05C5C','#5C9EE0','#E05CAD','#5CE0CB','#A0A0A0','#C45CE0','#E08A5C'];
const TIER_PALETTE = ['#FF7F7F','#FFBF7F','#FFDF7F','#FFFF7F','#BFFF7F','#7FFF7F','#7FFFFF','#7FBFFF','#7F7FFF','#FF7FFF','#BF7FBF','#3B3B3B','#858585','#CFCFCF','#F7F7F7'];

let url = localStorage.getItem('supaUrl') || '';
let key = localStorage.getItem('supaKey') || '';
let cfgMeta = localStorage.getItem('cfgMeta') !== 'false';
let cfgGameNames = localStorage.getItem('cfgGameNames') !== 'false';
let cfgWrapGameNames = localStorage.getItem('cfgWrapGameNames') === 'true';
let cfgGameSource = localStorage.getItem('cfgGameSource') !== 'false';
let cfgFont = localStorage.getItem('cfgFont') || 'Inter';
let cfgTierLayout = localStorage.getItem('cfgTierLayout') || 'Wrap';
const playniteLocal = new URLSearchParams(location.search).get('playnite') === '1';
let hostStamp = 0;
let cfgInteractionMode = localStorage.getItem('cfgInteractionMode') || (localStorage.getItem('cfgInputMode') === 'touch' ? 'view' : 'drag');
let sidebarCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
let draggedGameId = null;
let draggedGameFromId = null;
let cardZoom = Math.max(40, Math.min(240, parseInt(localStorage.getItem('cardZoom') || '140') || 140));

let rootData = { Lists: [], Games: [], Settings: {} };
let gamesMap = {};
const ALL_GAMES_LIST_ID = 'automatic-all-games';
const allGamesList = { Id:ALL_GAMES_LIST_ID, Name:'Todos os jogos', HexColor:'#66c7ed', IsAutomatic:true, DefaultView:'Grid', SortOrder:'Alphabetical', GameIds:[], Children:[] };
function refreshAllGamesList() {
    allGamesList.GameIds = Object.keys(gamesMap);
    allGamesList.SortOrder = normalizeSortMode(rootData.Settings?.AllGamesSortOrder || 'Alphabetical');
}
let currentListId = null;
let currentSearch = '';

let lastDataString = '';
let editingListId = null;
let dirty = false;          // há edição local ainda não enviada
let saving = false;         // envio em andamento
let resaveAfter = false;    // houve nova edição durante o envio
let saveTimer = null;
let savedEditState = null;
let inFlightEditState = null;
let inFlightRevision = null;
let saveSequence = 0;
let saveWatchdog = null;
let draggedListId = null;
let draggedListNode = null;

// Toda alteração local passa por aqui: carimba, marca como pendente e salva sozinho (debounce).
function editState(data = rootData) {
    return JSON.stringify({ Lists: data.Lists, Settings: data.Settings },
        (key, value) => key.startsWith('_') ? undefined : value);
}

function markDirty() {
    normalizeTierColors(rootData.Lists);
    if (!saving && savedEditState !== null && editState() === savedEditState) {
        dirty = false;
        clearTimeout(saveTimer);
        return;
    }
    rootData.UpdatedAt = Math.max(Date.now(), (rootData.UpdatedAt || 0) + 1);
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => syncToSupabase(false), 700);
}

window.addEventListener('beforeunload', e => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function applySettings() {
    document.documentElement.style.setProperty('--font-family', `${cfgFont}, sans-serif`);
    document.getElementById('font-link').href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cfgFont)}:wght@400;500;600;700&display=swap`;
    document.documentElement.style.setProperty('--card-width', `${cardZoom}px`);
    document.getElementById('zoom-slider').value = cardZoom;
    document.body.classList.toggle('view-only', cfgInteractionMode === 'view');
    document.body.classList.toggle('wrap-game-names', cfgWrapGameNames);
    document.body.classList.toggle('drag-mode', cfgInteractionMode === 'drag');
    document.body.classList.toggle('double-move-mode', cfgInteractionMode === 'double');
    applySidebarState();
    const interactionMode = document.getElementById('interaction-mode');
    if (interactionMode) interactionMode.value = cfgInteractionMode;
    const sortSelect = document.getElementById('sort-select');
    if (sortSelect) sortSelect.disabled = false;
}

// The shared document is authoritative in both hosts; localStorage is only a startup cache.
function applySharedDisplaySettings(settings = {}) {
    cfgTierLayout = settings.TierLayoutMode === 'HorizontalScroll' ? 'HorizontalScroll' : 'Wrap';
    cfgMeta = settings.ShowMetacritic !== false;
    cfgGameNames = settings.ShowGameNames !== false;
    cfgWrapGameNames = settings.WrapGameNames === true;
    cfgGameSource = settings.ShowGameSource !== false;
    cfgInteractionMode = ['drag','double','view'].includes(settings.InteractionMode) ? settings.InteractionMode : 'drag';
    cardZoom = Math.max(40, Math.min(240, Number(settings.CardZoom) || 140));
    cfgFont = settings.InterfaceFont || 'Inter';
    for (const [key,value] of Object.entries({cfgTierLayout,cfgMeta,cfgGameNames,cfgWrapGameNames,cfgGameSource,cfgInteractionMode,cardZoom,cfgFont})) localStorage.setItem(key,value);
}

function changeInteractionMode(mode) {
    if (!['drag', 'double', 'view'].includes(mode)) mode = 'drag';
    cfgInteractionMode = mode;
    localStorage.setItem('cfgInteractionMode', cfgInteractionMode);
    rootData.Settings ||= {};
    rootData.Settings.InteractionMode = cfgInteractionMode;
    markDirty();
    applySettings();
    cancelDoubleClickMove();
    if (currentListId) selectList(currentListId, true);
}

function changeZoom(v) {
    cardZoom = Math.max(40, Math.min(240, parseInt(v) || 140));
    document.documentElement.style.setProperty('--card-width', `${cardZoom}px`);
    localStorage.setItem('cardZoom', cardZoom);
    rootData.Settings ||= {};
    rootData.Settings.CardZoom = cardZoom;
    markDirty();
    const slider = document.getElementById('zoom-slider');
    if (slider) slider.value = cardZoom;
    requestAnimationFrame(updateTierHeaderWidth);
}

function changeTierLayout(mode) {
    cfgTierLayout = mode === 'HorizontalScroll' ? 'HorizontalScroll' : 'Wrap';
    localStorage.setItem('cfgTierLayout', cfgTierLayout);
    if (rootData && rootData.Settings) {
        rootData.Settings.TierLayoutMode = cfgTierLayout;
        markDirty();
    }
    // Não recria os cards só para mudar o layout.
    // A troca deve ser instantânea e preservar a posição horizontal.
    applyTierLayoutDom();
}

function installReloadButton() {
    const reload = document.createElement('button');
    reload.textContent = 'Atualizar';
    reload.title = 'Busca as listas e configurações salvas. Não salva alterações.';
    reload.className = 'btn-outline';
    reload.onclick = () => {
        if (saving || (dirty && !confirm('Descartar as alterações não salvas e recarregar as listas?'))) return;
        clearTimeout(saveTimer);
        dirty = false;
        cancelDoubleClickMove();
        if (playniteLocal) window.requestPlayniteData();
        else loadData(false);
    };
    document.querySelector('.actions').appendChild(reload);
}

// Init
installReloadButton();
if (playniteLocal) {
    document.getElementById('setup-modal').style.display = 'none';
    document.getElementById('close-setup').style.display = 'block';
    document.getElementById('supa-url').closest('.input-group').style.display = 'none';
    document.getElementById('supa-key').closest('.input-group').style.display = 'none';
    applySettings();
    const admin = document.createElement('button');
    admin.textContent = 'Biblioteca, vínculos e sincronização';
    admin.className = 'btn-outline';
    admin.style.width = '100%';
    admin.style.marginTop = '12px';
    admin.onclick = async () => {
        if (dirty || saving) { alert('Aguarde a gravação das alterações antes de abrir a administração.'); return; }
        try {
            const result = JSON.parse(await sendPlayniteRequest(JSON.stringify({ Type: 'admin' })));
            if (!result.Ok) throw new Error('Administração indisponível');
            document.getElementById('setup-modal').style.display = 'none';
        } catch (error) { console.error(error); alert('Não foi possível abrir a administração do Playnite.'); }
    };
    document.querySelector('#setup-modal .modal-content').appendChild(admin);
} else if (url && key) {
    document.getElementById('setup-modal').style.display = 'none';
    document.getElementById('close-setup').style.display = 'block';
    applySettings();
    loadData(false);
    setInterval(() => loadData(true), 15000);
} else {
    document.getElementById('setup-modal').style.display = 'flex';
}

// Close ctx menu on any click
document.addEventListener('click', () => document.getElementById('ctx-menu').style.display = 'none');

function openSetup() {
    document.getElementById('supa-url').value = url;
    document.getElementById('supa-key').value = key;
    document.getElementById('cfg-meta').checked = cfgMeta;
    document.getElementById('cfg-game-names').checked = cfgGameNames;
    document.getElementById('cfg-wrap-game-names').checked = cfgWrapGameNames;
    document.getElementById('cfg-game-source').checked = cfgGameSource;
    document.getElementById('cfg-font').value = cfgFont;
    document.getElementById('cfg-tier-layout').value = cfgTierLayout;
    document.getElementById('setup-modal').style.display = 'flex';
    document.getElementById('close-setup').style.display = 'block';
}

function saveSetup() {
    const oldUrl = url;
    const oldKey = key;
    const endpointChanged = oldUrl !== document.getElementById('supa-url').value.trim() ||
                            oldKey !== document.getElementById('supa-key').value.trim();
    const hadData = !!(rootData && rootData.Lists && rootData.Lists.length);

    url = document.getElementById('supa-url').value.trim();
    key = document.getElementById('supa-key').value.trim();
    cfgMeta = document.getElementById('cfg-meta').checked;
    cfgGameNames = document.getElementById('cfg-game-names').checked;
    cfgWrapGameNames = document.getElementById('cfg-wrap-game-names').checked;
    cfgGameSource = document.getElementById('cfg-game-source').checked;
    cfgFont = document.getElementById('cfg-font').value.trim() || 'Inter';
    cfgTierLayout = document.getElementById('cfg-tier-layout').value || 'Wrap';
    localStorage.setItem('supaUrl', url);
    localStorage.setItem('supaKey', key);
    localStorage.setItem('cfgMeta', cfgMeta);
    localStorage.setItem('cfgGameNames', cfgGameNames);
    localStorage.setItem('cfgWrapGameNames', cfgWrapGameNames);
    localStorage.setItem('cfgGameSource', cfgGameSource);
    localStorage.setItem('cfgFont', cfgFont);
    localStorage.setItem('cfgTierLayout', cfgTierLayout);
    localStorage.setItem('cfgInteractionMode', cfgInteractionMode);
    localStorage.removeItem('cfgInputMode');
    if (rootData && rootData.Settings) {
        rootData.Settings.TierLayoutMode = cfgTierLayout;
        rootData.Settings.ShowGameNames = cfgGameNames;
        rootData.Settings.WrapGameNames = cfgWrapGameNames;
        rootData.Settings.ShowGameSource = cfgGameSource;
        rootData.Settings.ShowMetacritic = cfgMeta;
        rootData.Settings.InteractionMode = cfgInteractionMode;
        rootData.Settings.CardZoom = cardZoom;
        rootData.Settings.InterfaceFont = cfgFont;
    }
    applySettings();
    document.getElementById('setup-modal').style.display = 'none';

    // Não recarrega do Supabase quando apenas uma preferência local mudou.
    // O reload imediato anteriormente trazia a configuração antiga da nuvem
    // e desfazia o layout recém-selecionado.
    if (playniteLocal) {
        rootData.Settings.ShowMetacritic = cfgMeta;
        markDirty();
        if (currentListId) selectList(currentListId, true);
    } else if (url && key && (endpointChanged || !hadData)) {
        loadData(false);
    } else if (url && key && hadData) {
        markDirty();
        if (currentListId) selectList(currentListId, true);
    }
}

function collectExpanded(lists, map = {}) {
    (lists || []).forEach(l => {
        map[l.Id] = l._expanded === true;
        collectExpanded(l.Children, map);
    });
    return map;
}

function applyExpanded(lists, map) {
    (lists || []).forEach(l => {
        l._expanded = map[l.Id] === true;
        applyExpanded(l.Children, map);
    });
}

async function loadData(isAuto) {
    if (playniteLocal) { window.requestPlayniteData(); return; }
    // Edição local pendente ou envio em andamento: a nuvem ainda não tem as alterações, então
    // recarregar agora desfaria o que o usuário acabou de fazer.
    if (isAuto && (dirty || saving)) return;
    if (!isAuto) document.getElementById('loading-indicator').style.display = 'block';
    try {
        let cleanUrl = url.replace(/\/$/, '');
        const res = await fetch(`${cleanUrl}/rest/v1/playnite_lists?id=eq.my_playnite_lists`, {
            headers: { 'apikey': key, 'Authorization': `Bearer ${key}` }
        });
        const data = await res.json();
        if (data && data.length > 0 && data[0].lists_json) {
            // O usuário pode ter editado enquanto a requisição estava em andamento.
            if (isAuto && (dirty || saving)) return;

            const raw = typeof data[0].lists_json === 'string' ? data[0].lists_json : JSON.stringify(data[0].lists_json);
            let parsed = typeof data[0].lists_json === 'string' ? JSON.parse(data[0].lists_json) : data[0].lists_json;
            const colorsChanged = normalizeTierColors(parsed.Lists);

            if (isAuto) {
                const cloudStamp = parsed.UpdatedAt || 0;
                const localStamp = rootData.UpdatedAt || 0;
                if (cloudStamp) { if (cloudStamp <= localStamp) return; }      // nada novo
                else if (raw === lastDataString) return;                        // dados antigos sem carimbo
            }
            lastDataString = raw;

            const expanded = collectExpanded(rootData.Lists);
            const scrollTop = document.getElementById('content-area').scrollTop;
            rootData = parsed;
            savedEditState = editState(parsed);
            applySharedDisplaySettings(rootData.Settings || {});
            applySettings();
            applyExpanded(rootData.Lists, expanded);
            gamesMap = {};
            (rootData.Games || []).forEach(g => gamesMap[g.Id] = g);
            let prevId = currentListId;
            renderSidebar();
            if (prevId && getListById(rootData.Lists, prevId)) selectList(prevId);
            else if (rootData.Lists && rootData.Lists.length > 0) selectList(rootData.Lists[0].Id);
            else selectList(ALL_GAMES_LIST_ID);
            document.getElementById('content-area').scrollTop = scrollTop;
            if (colorsChanged) markDirty();
        }
    } catch (e) {
        if (!isAuto) { alert('Erro ao carregar do Supabase.'); openSetup(); }
    }
    if (!isAuto) document.getElementById('loading-indicator').style.display = 'none';
}

// ──────────────────────────────────────────────
// List tree helpers
// ──────────────────────────────────────────────
function getListById(lists, id) {
    if (id === ALL_GAMES_LIST_ID) return allGamesList;
    for (let l of lists) {
        if (l.Id === id) return l;
        if (l.Children && l.Children.length) { let f = getListById(l.Children, id); if (f) return f; }
    }
    return null;
}

function countGames(list) {
    let c = list.GameIds ? list.GameIds.length : 0;
    if (list.Children) list.Children.forEach(ch => c += countGames(ch));
    return c;
}

function findParent(lists, id, parent = null) {
    for (let l of lists) {
        if (l.Id === id) return parent;
        if (l.Children) { let f = findParent(l.Children, id, l); if (f !== undefined) return f; }
    }
    return undefined;
}

// ──────────────────────────────────────────────
// Ordenação e pesquisa da lista atual
// ──────────────────────────────────────────────
function normalizeSortMode(mode) {
    // O Playnite pode serializar o enum como número, string numérica ou nome.
    // A WebApp precisa aceitar todas as três formas para manter a ordenação
    // compatível com a extensão.
    if (typeof mode === 'number' && Number.isFinite(mode)) {
        return ['Manual', 'Alphabetical', 'Metacritic'][mode] || 'Manual';
    }
    if (mode && typeof mode === 'object') {
        // Alguns serializers expõem enums como { value__: 1 }.
        if (Number.isFinite(mode.value__)) return ['Manual', 'Alphabetical', 'Metacritic'][mode.value__] || 'Manual';
        if (mode.Value !== undefined) return normalizeSortMode(mode.Value);
    }
    if (mode === null || mode === undefined || mode === '') return 'Manual';

    const m = String(mode).trim();
    if (/^\d+$/.test(m)) {
        return ['Manual', 'Alphabetical', 'Metacritic'][Number(m)] || 'Manual';
    }

    const lower = m.toLowerCase();
    if (lower === 'alphabetical' || lower === 'alphabetic' || lower.includes('alphabet') || lower.includes('a-z')) return 'Alphabetical';
    if (lower === 'metacritic' || lower.includes('meta')) return 'Metacritic';
    return 'Manual';
}

const sortCollator = new Intl.Collator('pt-BR', {
    sensitivity: 'base',
    numeric: true,
    ignorePunctuation: true
});

function gameName(id) {
    const g = gamesMap[id];
    return String(g?.Name ?? g?.name ?? '');
}

function gameScore(id) {
    const g = gamesMap[id];
    // Supabase/JSON pode devolver números como strings.
    const value = g?.CriticScore ?? g?.criticScore ?? g?.Metacritic ?? g?.metacritic;
    if (value === null || value === undefined || value === '') return -1;
    const n = Number(value);
    return Number.isFinite(n) ? n : -1;
}

function getSortedGameIds(list, sortModeOverride = null, applySearch = true) {
    let ids = Array.from(list?.GameIds || []);
    const mode = normalizeSortMode(sortModeOverride ?? list?.SortOrder);

    if (mode === 'Alphabetical') {
        ids.sort((a, b) => {
            const result = sortCollator.compare(gameName(a), gameName(b));
            return result !== 0 ? result : String(a).localeCompare(String(b));
        });
    } else if (mode === 'Metacritic') {
        ids.sort((a, b) => {
            const scoreDiff = gameScore(b) - gameScore(a);
            if (scoreDiff !== 0) return scoreDiff;
            const nameDiff = sortCollator.compare(gameName(a), gameName(b));
            return nameDiff !== 0 ? nameDiff : String(a).localeCompare(String(b));
        });
    }

    if (applySearch && currentSearch.trim()) {
        const q = currentSearch.trim().toLocaleLowerCase();
        ids = ids.filter(id => gameName(id).toLocaleLowerCase().includes(q));
    }
    return ids;
}

function changeCurrentSearch(value) {
    currentSearch = value || '';
    selectList(currentListId, true);
}

function changeSortMode(value) {
    const list = getListById(rootData.Lists, currentListId);
    if (!list) return;
    list.SortOrder = value;
    if (list.IsAutomatic) {
        rootData.Settings ||= {};
        rootData.Settings.AllGamesSortOrder = value;
    }
    markDirty();
    selectList(currentListId, true);
}

function normalizeTierColors(lists) {
    let changed = false;
    (lists || []).forEach(parent => {
        if (parent.IsTier && parent.Children && parent.Children.length) {
            parent.Children.forEach((child, i) => {
                const color = TIER_PALETTE[Math.min(i, TIER_PALETTE.length - 1)];
                if (child.HexColor !== color) { child.HexColor = color; changed = true; }
            });
        }
        if (parent.Children) changed = normalizeTierColors(parent.Children) || changed;
    });
    return changed;
}

// ──────────────────────────────────────────────
// Sidebar rendering
// ──────────────────────────────────────────────
function clearListDragVisuals() {
    document.querySelectorAll('.list-item.drag-before, .list-item.drag-after, .list-item.drag-into, .list-children.drag-into')
        .forEach(el => el.classList.remove('drag-before', 'drag-after', 'drag-into'));
}

function listDropMode(item, clientY) {
    const rect = item.getBoundingClientRect();
    const ratio = (clientY - rect.top) / Math.max(1, rect.height);
    if (ratio < 0.25) return 'before';
    if (ratio > 0.75) return 'after';
    return 'into';
}

function moveListNode(dragId, targetId, mode) {
    if (cfgInteractionMode !== 'drag') return;
    if (!dragId || !targetId || dragId === targetId) return;

    const dragged = getListById(rootData.Lists, dragId);
    const target = getListById(rootData.Lists, targetId);
    if (!dragged || !target) return;
    if (dragged.IsAutomatic || target.IsAutomatic) return;

    // Never allow moving a node into one of its descendants.
    let p = target;
    while (p) {
        if (p.Id === dragId) return;
        p = findParent(rootData.Lists, p.Id);
    }

    function removeNode(lists) {
        for (let i = 0; i < lists.length; i++) {
            if (lists[i].Id === dragId) return lists.splice(i, 1)[0];
            if (lists[i].Children) {
                const found = removeNode(lists[i].Children);
                if (found) return found;
            }
        }
        return null;
    }

    const node = removeNode(rootData.Lists);
    if (!node) return;

    if (mode === 'into') {
        if (!target.Children) target.Children = [];
        target.Children.push(node);
    } else {
        const parent = findParent(rootData.Lists, targetId);
        const siblings = parent ? (parent.Children || (parent.Children = [])) : rootData.Lists;
        const targetIndex = siblings.findIndex(x => x.Id === targetId);
        if (targetIndex < 0) { rootData.Lists.push(node); }
        else siblings.splice(mode === 'after' ? targetIndex + 1 : targetIndex, 0, node);
    }

    node._expanded = node._expanded === true;
    markDirty();
    clearListDragVisuals();
    renderSidebar();
    if (currentListId) selectList(currentListId, true);
}

function applySidebarState() {
    const sidebar = document.querySelector('.sidebar');
    const btn = document.getElementById('sidebar-toggle');
    if (!sidebar) return;
    sidebar.classList.toggle('collapsed', sidebarCollapsed);
    if (btn) {
        btn.textContent = sidebarCollapsed ? '▶' : '◀';
        btn.title = sidebarCollapsed ? 'Expandir barra lateral' : 'Recolher barra lateral';
    }
}

function toggleSidebar() {
    sidebarCollapsed = !sidebarCollapsed;
    localStorage.setItem('sidebarCollapsed', sidebarCollapsed);
    applySidebarState();
    requestAnimationFrame(updateTierHeaderWidth);
}

function renderSidebar() {
    refreshAllGamesList();
    if (migrateTimelineLists(rootData.Lists || [])) markDirty();
    const c = document.getElementById('lists-container');
    c.innerHTML = '';
    renderListGroup([allGamesList], c, true);
    renderListGroup(rootData.Lists || [], c, true);
    updateAllListsButton();
}

function expandableLists(lists = rootData.Lists || []) {
    return lists.flatMap(list => [...((list.Children || []).length ? [list] : []), ...expandableLists(list.Children || [])]);
}
function updateAllListsButton() {
    const button = document.getElementById('lists-expand-toggle');
    const lists = expandableLists();
    const expanded = lists.length > 0 && lists.every(list => list._expanded === true);
    button.textContent = expanded ? 'Recolher todas' : 'Expandir todas';
    button.setAttribute('aria-expanded', String(expanded));
    button.disabled = lists.length === 0;
}
function toggleAllLists() {
    const lists = expandableLists();
    const expand = !lists.every(list => list._expanded === true);
    lists.forEach(list => { list._expanded = expand; });
    renderSidebar();
}

function renderListGroup(lists, container, isRoot) {
    const parent = lists.length ? findParent(rootData.Lists, lists[0].Id) : null;
    if (parent && listView(parent) === 'Timeline') lists = orderedTimelineChildren(parent);
    for (let list of lists) {
        const hasChildren = list.Children && list.Children.length > 0;
        const isExpanded = list._expanded === true;

        const item = document.createElement('div');
        item.className = 'list-item' + (currentListId === list.Id ? ' active' : '');
        item.dataset.listId = list.Id;

        item.innerHTML = `
            <span class="chevron ${hasChildren ? (isExpanded ? 'open' : '') : 'empty'}"
                  onclick="event.stopPropagation(); toggleExpand('${list.Id}')">▶</span>
            <div class="list-color" style="background:${list.HexColor || '#8B7CFF'}"></div>
            <div class="list-name" title="${esc(list.Name)}">${esc(list.Name)}</div>
            <div class="list-count">${countGames(list)}</div>
        `;
        item.draggable = cfgInteractionMode === 'drag' && !list.IsAutomatic;
        item.addEventListener('click', () => selectList(list.Id));
        item.addEventListener('contextmenu', e => { e.preventDefault(); showCtxMenu(e, list); });

        // Jogos podem ser soltos diretamente em qualquer lista da árvore lateral.
        item.addEventListener('dragover', e => {
            if (cfgInteractionMode !== 'drag') return;
            // Alguns browsers não expõem DataTransfer.getData() durante dragover.
            // Por isso o card guarda a origem em variáveis de estado no dragstart.
            const fromId = draggedGameFromId || (e.dataTransfer && e.dataTransfer.getData('text/x-from'));
            if (!fromId || !draggedGameId || draggedListId) return;
            const from = getListById(rootData.Lists, fromId);
            if (!from || from.Id === list.Id || normalizeSortMode(list.SortOrder) !== 'Manual') return;
            e.preventDefault();
            e.stopPropagation();
            clearListDragVisuals();
            item.classList.add('drag-into');
            e.dataTransfer.dropEffect = 'move';
        });

        item.addEventListener('drop', e => {
            if (cfgInteractionMode !== 'drag') return;
            const fromId = draggedGameFromId || (e.dataTransfer && e.dataTransfer.getData('text/x-from'));
            const gid = draggedGameId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
            if (!fromId || !gid || draggedListId) return;
            const from = getListById(rootData.Lists, fromId);
            const to = getListById(rootData.Lists, list.Id);
            if (!from || !to || to.IsAutomatic || normalizeSortMode(to.SortOrder) !== 'Manual') return;
            e.preventDefault();
            e.stopPropagation();
            moveGameToList(gid, from.Id, to.Id);
            clearListDragVisuals();
            draggedGameId = null;
            draggedGameFromId = null;
        });

        item.addEventListener('dragstart', e => {
            if (list.IsAutomatic) { e.preventDefault(); return; }
            if (cfgInteractionMode !== 'drag') { e.preventDefault(); return; }
            draggedListId = list.Id;
            draggedListNode = list;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/x-list-id', list.Id);
            e.dataTransfer.setData('text/plain', list.Id);
            item.classList.add('dragging');
            // Use a small visual clone instead of the browser's full-page ghost.
            const ghost = item.cloneNode(true);
            ghost.style.cssText = 'position:absolute;top:-1000px;left:-1000px;width:' + item.offsetWidth + 'px;opacity:.65;pointer-events:none;';
            document.body.appendChild(ghost);
            e.dataTransfer.setDragImage(ghost, Math.min(30, item.offsetWidth / 2), 18);
            setTimeout(() => ghost.remove(), 0);
        });

        item.addEventListener('dragover', e => {
            if (cfgInteractionMode !== 'drag') return;
            if (!draggedListId || draggedListId === list.Id) return;
            const dragged = getListById(rootData.Lists, draggedListId);
            if (!dragged) return;
            let p = list;
            while (p) {
                if (p.Id === draggedListId) return;
                p = findParent(rootData.Lists, p.Id);
            }
            e.preventDefault();
            e.stopPropagation();
            clearListDragVisuals();
            const mode = listDropMode(item, e.clientY);
            item.classList.add('drag-' + mode);
            e.dataTransfer.dropEffect = 'move';
        });

        item.addEventListener('dragleave', e => {
            if (!item.contains(e.relatedTarget)) item.classList.remove('drag-before', 'drag-after', 'drag-into');
        });

        item.addEventListener('drop', e => {
            if (cfgInteractionMode !== 'drag') return;
            e.preventDefault();
            e.stopPropagation();
            if (!draggedListId) return;
            const mode = listDropMode(item, e.clientY);
            const id = draggedListId;
            clearListDragVisuals();
            draggedListId = null;
            draggedListNode = null;
            moveListNode(id, list.Id, mode);
        });

        item.addEventListener('dragend', () => {
            item.classList.remove('dragging');
            clearListDragVisuals();
            draggedListId = null;
            draggedListNode = null;
        });
        container.appendChild(item);

        if (hasChildren) {
            const childWrap = document.createElement('div');
            childWrap.className = 'list-children';
            childWrap.style.display = isExpanded ? 'block' : 'none';
            childWrap.id = `children-${list.Id}`;
            renderListGroup(list.Children, childWrap, false);
            container.appendChild(childWrap);
        }
    }
}

function showMoveMenu(e, list) {
    const menu = document.getElementById('ctx-menu');
    menu.innerHTML = '<div style="padding:6px 12px; font-size:11px; color:var(--dim)">Mover para:</div>';
    // collect all lists
    function collectLists(lists, depth=0) {
        let r = [];
        for (let l of lists) {
            if (l.Id !== list.Id) r.push({l, depth});
            if (l.Children) r = r.concat(collectLists(l.Children, depth+1));
        }
        return r;
    }
    for (let {l, depth} of collectLists(rootData.Lists)) {
        const d = document.createElement('div');
        d.className = 'item';
        d.style.paddingLeft = (12 + depth * 14) + 'px';
        d.textContent = l.Name;
        d.onclick = (ev) => { ev.stopPropagation(); menu.style.display = 'none'; moveListInto(list.Id, l.Id); };
        menu.appendChild(d);
    }
    menu.style.display = 'block';
}

function moveListInto(listId, targetParentId) {
    if (listId === ALL_GAMES_LIST_ID || targetParentId === ALL_GAMES_LIST_ID) return;
    // Remove from current parent
    function removeFrom(lists) {
        for (let i = 0; i < lists.length; i++) {
            if (lists[i].Id === listId) { return lists.splice(i, 1)[0]; }
            if (lists[i].Children) { let r = removeFrom(lists[i].Children); if (r) return r; }
        }
    }
    const node = removeFrom(rootData.Lists);
    if (!node) return;
    const target = getListById(rootData.Lists, targetParentId);
    if (!target) { rootData.Lists.push(node); }
    else { if (!target.Children) target.Children = []; target.Children.push(node); }
    markDirty();
    renderSidebar();
    if (currentListId) selectList(currentListId);
}

function deleteListById(id) {
    if (id === ALL_GAMES_LIST_ID) return;
    const node = getListById(rootData.Lists, id);
    const parent = findParent(rootData.Lists, id);
    if (Number.isInteger(node?.TimelineYear) && parent) { deleteTimelineYear(id); return; }
    if (!confirm(`Excluir lista "${getListById(rootData.Lists, id)?.Name}"?`)) return;
    function removeFrom(lists) {
        for (let i = 0; i < lists.length; i++) {
            if (lists[i].Id === id) { lists.splice(i, 1); return true; }
            if (lists[i].Children && removeFrom(lists[i].Children)) return true;
        }
    }
    removeFrom(rootData.Lists);
    markDirty();
    if (currentListId === id || !getListById(rootData.Lists, currentListId)) {
        currentListId = null;
        document.getElementById('main-header').style.visibility = 'hidden';
        document.getElementById('content-area').innerHTML = '';
    }
    renderSidebar();
    if (currentListId) selectList(currentListId);
}

// ──────────────────────────────────────────────
// Edit modal
// ──────────────────────────────────────────────
let creatingParentId = null;
let creatingList = false;
function newListId() {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 15) | 64;
    bytes[8] = (bytes[8] & 63) | 128;
    const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}
function listView(list) {
    return ['Grid', 'Tier', 'Timeline'].includes(list.DefaultView) ? list.DefaultView : (list.IsTier ? 'Tier' : 'Grid');
}
function validYear(value) { return Number.isInteger(value) && value >= 1 && value <= 9999; }
function makeYearNode(year) {
    return { Id:newListId(), Name:String(year), TimelineYear:year, DefaultView:'Grid', IsTier:false,
        HexColor:'#66c7ed', SortOrder:'Manual', GameIds:[], Children:[] };
}
function orderedTimelineChildren(list) {
    const direction = list.TimelineOrder === 'Descending' ? -1 : 1;
    return [...(list.Children || [])].sort((a,b) => {
        if (validYear(a.TimelineYear) && validYear(b.TimelineYear)) return direction * (a.TimelineYear - b.TimelineYear);
        return validYear(a.TimelineYear) ? -1 : validYear(b.TimelineYear) ? 1 : 0;
    });
}
function migrateTimelineLists(lists) {
    let changed = false;
    for (const list of lists) {
        if (listView(list) === 'Timeline') {
            list.Children ||= [];
            list.GameIds ||= [];
            // Adopt numeric sublists and migrate the previous version's year assignments once.
            for (const child of list.Children) {
                if (!validYear(child.TimelineYear) && /^\d{1,4}$/.test(child.Name || '') && validYear(Number(child.Name))) {
                    child.TimelineYear = Number(child.Name);
                    changed = true;
                }
            }
            const assignments = list.TimelineYears || {};
            const years = [...new Set([...(list.TimelineRows || []), ...Object.values(assignments)])].filter(validYear);
            for (const year of years) {
                let child = list.Children.find(c => c.TimelineYear === year);
                if (!child) { child = makeYearNode(year); list.Children.push(child); changed = true; }
                const matching = list.GameIds.filter(id => assignments[id] === year);
                if (matching.length) {
                    child.GameIds = [...new Set([...(child.GameIds || []), ...matching])];
                    list.GameIds = list.GameIds.filter(id => assignments[id] !== year);
                    changed = true;
                }
            }
            if ((list.TimelineRows || []).length || Object.keys(assignments).length) {
                list.TimelineRows = [];
                list.TimelineYears = {};
                changed = true;
            }
        }
        if (migrateTimelineLists(list.Children || [])) changed = true;
    }
    return changed;
}
function changeTimelineOption(key, value) {
    const list = getListById(rootData.Lists, currentListId);
    const allowed = { TimelineOrder:['Ascending','Descending'], TimelineOrientation:['Vertical','Horizontal'] };
    if (!list || !allowed[key]?.includes(value)) return;

}
function changeListView(view) {

}
function openCreateList(parentId = null) {

function saveEditList() {
    let list = getListById(rootData.Lists, editingListId);
    if (creatingList) {
        const name = document.getElementById('edit-name').value.trim();
        if (!name) { document.getElementById('edit-name').focus(); return; }
        const parent = creatingParentId ? getListById(rootData.Lists, creatingParentId) : null;
        if (creatingParentId && !parent) return;
        list = { Id:newListId(), Name:name, HexColor:PALETTE[0], GameIds:[], Children:[], SortOrder:'Manual', TimelineRows:[], TimelineYears:{} };
        (parent ? (parent.Children ||= []) : rootData.Lists).push(list);

        currentListId = list.Id;
    }
    if (!list) return;
    if (Number.isInteger(list.TimelineYear)) {
        const year = Number(document.getElementById('edit-name').value.trim());
        const parent = findParent(rootData.Lists, list.Id);

        if (parent?.Children.some(child => child.Id !== list.Id && child.TimelineYear === year)) { alert('Esse ano já existe nesta linha do tempo.'); return; }
        list.TimelineYear = year;
        document.getElementById('edit-name').value = String(year);
    }
    list.Name = document.getElementById('edit-name').value.trim() || list.Name;
    list.TimelineOrder = document.getElementById('edit-timeline-order').value;
    list.TimelineOrientation = document.getElementById('edit-timeline-orientation').value;
    list.DefaultView = document.getElementById('edit-view').value;
    list.IsTier = list.DefaultView === 'Tier';
    const selected = document.querySelector('#edit-colors .color-dot.selected');
    if (selected) list.HexColor = selected.dataset.hex;
    document.getElementById('edit-modal').style.display = 'none';
    markDirty();

function generateCard(id) {
    const g = gamesMap[id] || { Name: '?', Platform: '' };
    const initial = (g.Name || '?').charAt(0).toUpperCase();
    let bgStyle;
    if (g.CoverUrl) {
        bgStyle = `style="background-image:url('${g.CoverUrl}'); color:transparent;"`;
    } else {
        let hash = 0; for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
        bgStyle = `style="background:linear-gradient(135deg,hsl(${Math.abs(hash)%360},50%,18%),hsl(${(Math.abs(hash)+50)%360},50%,13%))"`;
    }
    let meta = '';
    if (cfgMeta && g.CriticScore) {
        const cls = g.CriticScore >= 75 ? 'meta-green' : g.CriticScore >= 50 ? 'meta-yellow' : 'meta-red';
        meta = `<div class="metacritic ${cls}">${g.CriticScore}</div>`;
    }
    const src = g.Source || g.Platform || '';

    const tooltip = `${g.Name || '?'}${src ? '\nBiblioteca: ' + src : ''}`;
    return `<div class="game-card" data-id="${id}" draggable="false" title="${esc(tooltip)}">
        <div class="game-cover" ${bgStyle}>${g.CoverUrl ? '' : esc(initial)}</div>
        ${meta}
        ${(cfgGameNames || cfgGameSource) ? `<div class="game-info">
            ${cfgGameNames ? `<div class="game-title">${esc(g.Name)}</div>` : ''}
            ${cfgGameSource ? `<div class="game-platform">${esc(src)}</div>` : ''}
        </div>` : ''}
    </div>`;
}

        c.draggable = false;
    });
    initDoubleClickMove();
}

// Todas as linhas da Tier List usam a largura do maior nome.
function updateTierHeaderWidth() {
    const area = document.getElementById('content-area');
    if (!area) return;
    const headers = Array.from(area.querySelectorAll('.tier-header'));
    if (!headers.length) {
        area.style.removeProperty('--tier-header-width');
        return;
    }

    // Mede o texto sem depender da largura atual do próprio header.
    // Isso evita a circularidade do scrollWidth quando o texto está com
    // word-break/break-word e o header já recebeu a largura anterior.
    const canvas = updateTierHeaderWidth._canvas || (updateTierHeaderWidth._canvas = document.createElement('canvas'));
    const ctx = canvas.getContext('2d');
    const cardW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-width')) || 140;
    const minHeader = Math.max(40, Math.min(90, Math.round(cardW * 0.9)));
    let max = minHeader;
    headers.forEach(h => {
        const cs = getComputedStyle(h);
        ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const text = h.textContent.trim();
        const measured = Math.ceil(ctx.measureText(text).width + parseFloat(cs.paddingLeft || 0) + parseFloat(cs.paddingRight || 0) + 2);
        max = Math.max(max, measured);
    });
    area.style.setProperty('--tier-header-width', `${max}px`);
}


window.addEventListener('resize', () => {
    requestAnimationFrame(updateTierHeaderWidth);
});
document.addEventListener('transitionend', e => {
    if (e.propertyName === 'width' && e.target.classList.contains('sidebar')) requestAnimationFrame(updateTierHeaderWidth);
});

function captureTierScrollPositions() {

let contentRenderRevision = 0;
function restoreTierScrollPositions(positions, revision = contentRenderRevision) {
    if (!positions) return;
    requestAnimationFrame(() => {

        document.querySelectorAll('.tier-games.horizontal-scroll[data-list-id]').forEach(el => {
